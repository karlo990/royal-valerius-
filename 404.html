<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page not found — Royal Crest Academy</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0C1638">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preload" as="font" type="font/woff2" href="/assets/fonts/newsreader-latin.woff2" crossorigin>
<link rel="stylesheet" href="/assets/css/styles.css">
<style>
  .not-found {
    min-height: 100vh;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 48px var(--gutter);
    text-align: center;
  }
  .not-found-inner { max-width: 34rem; }
  .not-found-crest { width: 72px; height: auto; margin: 0 auto 36px; }
  .not-found .eyebrow { justify-content: center; }
  .not-found .eyebrow::before { display: none; }
  .not-found .section-title { margin-bottom: 20px; }
  .not-found .section-lead { margin: 0 auto 36px; }
  .not-found-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
</style>
</head>
<body>
<main class="not-found">
  <div class="not-found-inner">
    <a href="/" aria-label="Royal Crest Academy home"><img class="not-found-crest" src="/assets/img/crest-192.webp" width="72" height="85" alt=""></a>
    <p class="eyebrow">Error 404</p>
    <h1 class="section-title">This page has <em>moved on.</em></h1>
    <p class="section-lead">The page you were looking for doesn’t exist or may have been moved. Head back to the homepage, or get in touch with our admissions team.</p>
    <div class="not-found-actions">
      <a href="/" class="btn btn-primary">Back to the homepage</a>
      <a href="/#contact" class="btn btn-outline">Contact admissions</a>
    </div>
  </div>
</main>
</body>
</html>
