<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Royal Crest concept poster v2</title>
<style>
@font-face{font-family:Archivo;src:url(../../assets/fonts/Archivo-Variable.woff2) format("woff2");font-weight:100 900;font-stretch:62% 125%}
@font-face{font-family:Mono;src:url(../../assets/fonts/IBMPlexMono-SemiBold.woff2) format("woff2");font-weight:600}
@font-face{font-family:Jakarta;src:url(../../../assets/fonts/plus-jakarta-sans-latin.woff2) format("woff2");font-weight:400 700}
@font-face{font-family:Newsreader;src:url(../../../assets/fonts/newsreader-latin.woff2) format("woff2");font-weight:400 500}
@font-face{font-family:Newsreader;font-style:italic;src:url(../../../assets/fonts/newsreader-italic-latin.woff2) format("woff2");font-weight:400}
:root{--navy:#13215a;--ink:#0b1533;--gold:#d2ae4c;--gold7:#8a6a1c;--yellow:#f8c828;--muted:#525a70;--ivory:#f3efe6}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:var(--w);height:var(--h);overflow:hidden}
#stage{position:relative;width:var(--w);height:var(--h);overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%}
#ui{position:absolute;inset:0;font-family:Jakarta,sans-serif;color:var(--ink)}
.abs{position:absolute}
/* filmic finish: vignette + fine grain */
#stage::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(20,24,40,.10) 100%),
  url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  mix-blend-mode:soft-light;opacity:.55}
.fam-night #stage::after{background:radial-gradient(110% 85% at 50% 42%,transparent 50%,rgba(2,6,20,.45) 100%),
  url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .5 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");opacity:.7;mix-blend-mode:normal}

/* crest lockup */
.lock{display:flex;align-items:center;gap:16px}
.lock img{width:62px;height:auto;filter:drop-shadow(0 2px 4px rgba(10,19,48,.22))}
.lock b{display:block;font-family:Newsreader,serif;font-weight:500;font-size:31px;letter-spacing:-.2px;color:var(--navy);line-height:1}
.lock i{display:block;font-style:normal;font-size:12.5px;font-weight:700;letter-spacing:3.2px;color:var(--gold7);margin-top:7px}
.lock.light b{color:#f6f3ec}.lock.light i{color:var(--yellow)}
.lock.small img{width:50px}.lock.small b{font-size:25px}.lock.small i{font-size:10.5px;letter-spacing:2.8px}
.cx{display:flex;justify-content:center}
.contact{display:flex;align-items:center;gap:10px;font-weight:600;font-size:23px;color:var(--ink)}
.contact svg{width:27px;height:27px}.contact .dot{color:var(--muted)}
.contact.light{color:#f3efe6}.contact.light .dot{color:rgba(243,239,230,.6)}
.size-story .contact{font-size:25px}
.site{font-size:19px;font-weight:600;letter-spacing:.4px;color:var(--muted)}
.fam-night .site{color:rgba(243,239,230,.72)}
.size-wide .site,.size-wide .contact{font-size:21px}
.fam-studio .site,.fam-studio .contact{text-shadow:0 0 10px #f1eee8,0 0 18px #f1eee8}
.footr{display:flex;flex-direction:column;align-items:flex-end;gap:6px}.footr .contact{font-size:21px}.footr .contact svg{width:24px;height:24px}.footr .site{font-size:17px}

/* grotesque headline (studio / night / corner) */
.h-grot{font-family:Archivo,sans-serif;font-weight:900;text-transform:uppercase;line-height:.88;letter-spacing:-.02em;color:var(--navy)}
.h-grot span{display:block;white-space:nowrap}
.h-grot .k{background:linear-gradient(100deg,#7d5f17 0%,#b8902f 28%,#e2c26a 46%,#a07a1f 64%,#8a6a1c 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.04em}
.fam-night .h-grot{color:#f6f3ec}
.fam-night .h-grot .k{background:none;color:var(--yellow);text-shadow:0 0 40px rgba(248,200,40,.25)}
.rule{height:7px;width:84px;margin:30px 0 26px;background:linear-gradient(90deg,#a07a1f,#d2ae4c)}
.fam-night .rule{background:var(--yellow)}
.sub{line-height:1.3;font-weight:500;color:#2a3352;max-width:560px}
.fam-night .sub{color:rgba(243,239,230,.86)}
.size-wide .sub{max-width:700px}
.size-story .sub,.size-sq .tb .sub{max-width:760px}
.pill{display:inline-flex;align-items:center;gap:14px;background:var(--navy);color:#f3f1ea;border-radius:999px;padding:16px 28px 16px 24px;font-weight:600;font-size:22px;box-shadow:0 14px 30px -14px rgba(10,19,48,.55);white-space:nowrap}
.pill em{font-style:normal;color:var(--gold);font-weight:700;letter-spacing:2px;font-size:17px}
.fam-night .pill{background:var(--yellow);color:var(--navy);box-shadow:0 14px 34px -12px rgba(248,200,40,.45)}
.fam-night .pill em{color:var(--navy)}

/* corner family */
.h-grot.one{letter-spacing:-.035em}
.caps{font-family:Archivo,sans-serif;font-weight:700;text-transform:uppercase;line-height:1.12;letter-spacing:-.01em;color:var(--navy);margin-top:8px}
.meta{line-height:1.35;color:var(--ink)}.meta b{display:block;font-weight:600}.meta span{color:var(--muted);display:block}.meta.r{text-align:right}

/* editorial family */
.frame{position:absolute;inset:26px;border:1.5px solid rgba(138,106,28,.45);pointer-events:none}
.frame::before{content:"";position:absolute;inset:7px;border:1px solid rgba(138,106,28,.22)}
.tc{text-align:center}.tc.l{text-align:left}
.eyebrow{display:flex;align-items:center;justify-content:center;gap:16px;font-weight:700;font-size:14px;letter-spacing:4px;color:var(--gold7);text-transform:uppercase}
.tc.l .eyebrow{justify-content:flex-start}.tc.l .eyebrow i:first-child{display:none}
.eyebrow i{display:block;width:46px;height:1.5px;background:var(--gold)}
.h-serif{font-family:Newsreader,serif;font-weight:500;line-height:1.02;letter-spacing:-.022em;color:var(--navy);margin:22px 0 20px}
.h-serif span{display:block;white-space:nowrap}
.h-serif .it{font-style:italic;font-weight:400;color:var(--gold7)}
.tc .sub{margin:0 auto;max-width:720px;color:#3a4260;font-weight:500}.tc.l .sub{margin:0}
.foot{text-align:center;display:flex;flex-direction:column;align-items:center;gap:9px}
.foot.l{align-items:flex-start;text-align:left}
.foot .hair{width:120px;height:1.5px;background:var(--gold);margin-bottom:6px}
.foot b{font-weight:700;font-size:15px;letter-spacing:3.2px;color:var(--navy)}
.foot span{display:flex;align-items:center;gap:8px;font-size:17px;color:var(--muted);font-weight:500}
.foot svg{width:19px;height:19px}
.size-story .foot b{font-size:18px}.size-story .foot span{font-size:21px}.size-story .eyebrow{font-size:17px}
.size-wide .foot b{font-size:16px}
#ink{position:absolute;inset:0}
</style>
</head>
<body>
<div id="stage"><canvas id="gl"></canvas><canvas id="ink"></canvas><div id="ui"></div></div>
<script type="importmap">{"imports":{"three":"../node_modules/three/build/three.module.js","three/addons/":"../node_modules/three/examples/jsm/"}}</script>
<script type="module">
import { run } from './engine.js';
import { CONCEPTS } from './concepts.js';
const q = new URLSearchParams(location.search);
window.DATA = CONCEPTS.map(({ id, family, h, key, big, sub, eyebrow, caption, status, tags }) => ({ id, family, h, key, big, sub, eyebrow, caption, status, tags }));
if (q.has('list')) { window.ready = true; } else {
const C = CONCEPTS.find((c) => c.id === q.get('id')) || CONCEPTS[0];
try { await run(C, q.get('s') || 'feed'); } catch (e) { console.error(e); window.err = String(e && e.stack || e); window.ready = true; } }
</script>
</body>
</html>
