<html>

<style>
@font-face{font-family:Archivo;src:url(../assets/fonts/Archivo-Variable.woff2) format("woff2");font-weight:100 900;font-stretch:62% 125%}
@font-face{font-family:Jakarta;src:url(../../assets/fonts/plus-jakarta-sans-latin.woff2) format("woff2");font-weight:400 700}
@font-face{font-family:Newsreader;src:url(../../assets/fonts/newsreader-latin.woff2) format("woff2");font-weight:400 500}
@font-face{font-family:Mono;src:url(../assets/fonts/IBMPlexMono-SemiBold.woff2) format("woff2");font-weight:600}

*{box-sizing:border-box;margin:0;padding:0}

.lock{position:absolute;display:flex;align-items:center;gap:16px}
.lock img{width:62px;height:auto;filter:drop-shadow(0 2px 3px rgba(10,19,48,.18))}
.lock b{display:block;font-family:Newsreader,serif;font-weight:500;font-size:31px;letter-spacing:-.2px;color:var(--navy);line-height:1}
.lock i{display:block;font-style:normal;font-size:12.5px;font-weight:700;letter-spacing:3.2px;color:var(--gold7);margin-top:7px}
.wa{position:absolute;display:flex;align-items:center;gap:10px;font-weight:600;font-size:24px;color:var(--ink)}
.wa svg{width:28px;height:28px}

h1 span{display:block}

.sub{position:absolute;font-size:31px;line-height:1.3;font-weight:500;color:#2a3352}
.tag{position:absolute;font-family:Mono,monospace;font-size:21px;letter-spacing:.5px;color:var(--ink)}
.meta{position:absolute;font-size:19px;line-height:1.35;color:var(--ink)}
.meta b{display:block;font-weight:700}
.meta span{color:var(--muted)}

.site{position:absolute;font-size:19px;font-weight:600;letter-spacing:.4px;color:var(--muted)}
#ink{position:absolute;inset:0}
</style>
</head>

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const q = new URLSearchParams(location.search);

const C = q.get('c') || 'a';                 // a = direction, b = delete
const STORY = q.get('s') === 'story';        // feed 1080x1350, story 1080x1920

  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const u = (pos.getY(i) + .5);
    const p = curve.getPointAt(u);

function roundedBox(w, h, d, r) {
  // keycap: rounded, slightly tapered box
  const s = new THREE.Shape(); const x = -w / 2, y = -d / 2;
  s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r); s.lineTo(x + w, y + d - r);
  s.quadraticCurveTo(x + w, y + d, x + w - r, y + d); s.lineTo(x + r, y + d); s.quadraticCurveTo(x, y + d, x, y + d - r);
  s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
  const g = new THREE.ExtrudeGeometry(s, { depth: h, bevelEnabled: true, bevelThickness: .12, bevelSize: .1, bevelSegments: 6, curveSegments: 12 });
  g.rotateX(-Math.PI / 2); g.translate(0, -h / 2, 0);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) { const t = (p.getY(i) + h / 2) / h; const k = 1 - .12 * Math.max(0, Math.min(1, t)); p.setX(i, p.getX(i) * k); p.setZ(i, p.getZ(i) * k); }
  g.computeVertexNormals(); return g;
}
