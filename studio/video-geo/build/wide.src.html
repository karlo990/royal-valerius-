/* ---------- crossfade helper on the shared layer ---------- */
const POOL={};function layer(id){let L=POOL[id];if(!L){const c=document.createElement('canvas');c.width=CW;c.height=CH;const q=c.getContext('2d');q.scale(1.5,1.5);L=POOL[id]={c,g:q}}L.g.save();L.g.setTransform(1,0,0,1,0,0);L.g.clearRect(0,0,CW,CH);L.g.restore();return L}
async function xL(t,at,dur,B){const k=eio((t-at)/dur);if(k<=0)return;const prev=g,L=layer('_x'+dur+at.toFixed(2).slice(-3));g=L.g;await B();g=prev;g.save();g.setTransform(1,0,0,1,0,0);g.globalAlpha=k;g.drawImage(L.c,0,0);g.restore()}

/* ---------- build DOM ---------- */
const ORDER=TL.scenes.map(s=>s.id);
$('#rail').innerHTML=LNAMES.map((l,i)=>`<div><i><u></u></i>0${i+1} ${l}</div>`).join('');
ORDER.forEach(id=>{const d=document.createElement('div');d.className='sc';d.id='s_'+id;d.innerHTML=SC[id].dom(SCN[id]);d.style.opacity=0;$('#scenes').appendChild(d);d.querySelectorAll('[data-in]').forEach(e=>{e.style.opacity=0})});
TL.lines.forEach(l=>{const parts=l.cap.match(/[^.!?]+[.!?”’]*\s*/g)||[l.cap];const out=[];let cur='';for(const p of parts){if((cur+p).length>92&&cur){out.push(cur.trim());cur=p}else cur+=p}if(cur.trim())out.push(cur.trim());
  const tot=out.reduce((a,b)=>a+b.length,0);let acc=0;l.ch=out.map(txt=>{const st=l.start+(l.end-l.start)*acc/tot;acc+=txt.length;return{txt,st}})});
const esc=s=>s.replace(/[&<]/g,c=>({'&':'&amp;','<':'&lt;'}[c]));
const NAMES={TEN:['T','TEACHER TENDAI · GEOGRAPHY'],SAM:['S','SAM · COMMENTARY']};let lastCap='';

/* ---------- main render ---------- */
window.renderAt=async function(t){
  const Wt={};for(const s of TL.scenes)Wt[s.id]=clamp((t-s.start+.35)/.7)*clamp((s.end-t+.35)/.7);
  const vis=ORDER.filter(id=>Wt[id]>0),main=vis.reduce((a,b)=>Wt[b]>=(Wt[a]??-1)?b:a,vis[0]);
  const G=$('#bgc').getContext('2d');G.setTransform(1,0,0,1,0,0);G.clearRect(0,0,CW,CH);let acc=0;
  for(const id of [...vis].sort((a,b)=>SCN[a].start-SCN[b].start)){const L=layer(id);g=L.g;await SC[id].draw(t,SCN[id]);acc+=Wt[id];G.globalAlpha=acc>0?Wt[id]/acc:1;G.drawImage(L.c,0,0);G.globalAlpha=1}
  $('#f').classList.toggle('light',!!SC[main].light);
  for(const id of ORDER){const el=$('#s_'+id),w=Wt[id];el.style.opacity=w;el.style.visibility=w>0?'visible':'hidden';if(w<=0)continue;
    el.querySelectorAll('[data-in]').forEach(e=>{const k=eo((t-e.dataset.in)/.7),o=e.dataset.out?clamp((e.dataset.out-t)/.5):1;e.style.opacity=k*o;e.style.translate=`0 ${(1-k)*18}px`;if(e.dataset.fx==='blur')e.style.filter=`blur(${(1-k)*10}px)`});
    el.querySelectorAll('[data-hl]').forEach(e=>{e.style.opacity=lerp(.3,1,eo((t-e.dataset.hl)/.5))});SC[id].update&&SC[id].update(t)}
  const ls=LESSON[main]||0;$('#rail').querySelectorAll('div').forEach((d,i)=>{const n=i+1,ids=Object.keys(LESSON).filter(k=>LESSON[k]===n),a=SCN[ids[0]].start,b=SCN[ids[ids.length-1]].end;const p=t<a?0:t>b?1:(t-a)/(b-a);d.querySelector('u').style.width=(p*100)+'%';d.classList.toggle('on',n===ls)});
  $('#rail').style.opacity=clamp(Object.keys(LESSON).reduce((q,k)=>q+(Wt[k]||0),0));
  let cta=0,ws=0;for(const id of vis){cta+=Wt[id]*SC[id].cta;ws+=Wt[id]}$('#cta').style.opacity=ws?cta/ws:0;
  $('#leak').style.background=`radial-gradient(520px 520px at ${1150+Math.sin(t*.25)*60}px ${40+Math.cos(t*.2)*30}px,rgba(255,240,210,.4),transparent 70%)`;
  $('#grain').style.backgroundPosition=`${Math.floor(t*30*97)%240}px ${Math.floor(t*30*53)%240}px`;
  let L=null;for(const l of TL.lines){if(t>=l.start-.05&&t<l.end+.9)L=l}
  const low=$('#lower'),prev=TL.lines.filter(l=>l.end<t).pop();low.style.opacity=L?eo((t-L.start+.3)/.35):prev?clamp(1-(t-prev.end-.9)/.3):0;
  if(L){const who=L.who,ch=L.ch.filter(c=>t>=c.st-.05).pop()||L.ch[0],key=L.id+ch.txt;if(key!==lastCap){$('#av').className=who;$('#av').textContent=NAMES[who][0];$('#cap').innerHTML=esc(ch.txt);lastCap=key}
    $('#who').innerHTML=NAMES[who][1]+(t<L.end?'<i>'+[0,1,2,3].map(i=>`<u style="height:${3+7*Math.abs(Math.sin(t*11+i*1.9))}px"></u>`).join('')+'</i>':'');const k=eo((t-ch.st)/.35);$('#cap').style.opacity=k;$('#cap').style.translate=`0 ${(1-k)*6}px`}
  const st=$('#sticker');let sk=0,stxt='';for(const l of TL.lines){if(!/^Wait/.test(l.cap))continue;const d=t-l.start;if(d>-.1&&d<2.2){sk=back(d/.35)*clamp((2.2-d)/.3);stxt=l.cap.includes('door')?'WHICH WAY DOES IT FACE?':'WE’RE INSIDE THE CLOUD!'}}
  st.style.opacity=clamp(sk);st.style.transform=`rotate(-5deg) scale(${lerp(.4,1,clamp(sk,0,1.2))})`;if(stxt)st.lastChild.textContent=stxt;
};
