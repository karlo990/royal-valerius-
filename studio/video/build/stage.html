<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Mandarin Connect — stage</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@500;700&display=block">
<style>
@font-face{font-family:"Newsreader";font-style:normal;font-weight:200 800;src:url(../../../assets/fonts/newsreader-latin.woff2) format("woff2"),url(../../../assets/fonts/newsreader-latin-ext.woff2) format("woff2")}
@font-face{font-family:"Newsreader";font-style:italic;font-weight:200 800;src:url(../../../assets/fonts/newsreader-italic-latin.woff2) format("woff2")}
@font-face{font-family:"NewsreaderX";font-style:italic;font-weight:200 800;src:url(../../../assets/fonts/newsreader-italic-latin-ext.woff2) format("woff2")}
@font-face{font-family:"NewsreaderX";font-style:normal;font-weight:200 800;src:url(../../../assets/fonts/newsreader-latin-ext.woff2) format("woff2")}
@font-face{font-family:"Plus Jakarta Sans";font-weight:400 800;src:url(../../../assets/fonts/plus-jakarta-sans-latin.woff2) format("woff2"),url(../../../assets/fonts/plus-jakarta-sans-latin-ext.woff2) format("woff2")}
:root{
  /* Mandarin edition of the Royal Crest film system: repo navy/gold + cinnabar seal red on rice paper */
  --paper:#F7F1E5; --paper-2:#FCF9F2; --navy:#13215a; --navy-deep:#0a1330; --ink:#0b1533;
  --gold:#d2ae4c; --gold-hi:#e2c26a; --gold-deep:#8a6a1c; --cinnabar:#C8372D; --cinnabar-deep:#9E2A22;
  --jade:#2E7D6B; --body:#3a3f55;
  --serif:"Newsreader","NewsreaderX","Noto Serif SC",Georgia,serif;
  --sans:"Plus Jakarta Sans","Noto Serif SC",system-ui,sans-serif;
  --zh:"Noto Serif SC","Newsreader",serif; --brush:"Ma Shan Zheng","Noto Serif SC",serif;
  --nv:0;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1280px;height:720px;overflow:hidden;background:#000}
#stage{position:relative;width:1280px;height:720px;overflow:hidden;font-family:var(--sans);color:var(--ink)}
canvas{display:block}
#bg{position:absolute;inset:0;width:1280px;height:720px}
.lockup{position:absolute;left:50px;top:28px;display:flex;gap:12px;align-items:center;z-index:6}
.lockup img{width:46px;height:46px;object-fit:contain}
.lockup b{display:block;font-size:17px;font-weight:800;letter-spacing:.11em;color:color-mix(in srgb,#fff calc(var(--nv)*100%),var(--navy))}
.lockup small{display:block;font-size:13px;font-weight:700;letter-spacing:.12em;color:color-mix(in srgb,var(--gold) calc(var(--nv)*100%),var(--cinnabar))}
.pill{position:absolute;right:46px;top:36px;height:36px;padding:0 16px 0 6px;border-radius:18px;background:var(--cinnabar);color:#fff;display:flex;gap:9px;align-items:center;
  font-size:13.5px;font-weight:800;letter-spacing:.12em;box-shadow:0 8px 20px -8px rgba(200,55,45,.8);z-index:6}
.pill i{width:26px;height:26px;border-radius:50%;background:#fff;color:var(--cinnabar);display:grid;place-items:center;font:700 15px var(--zh);font-style:normal}
#dial{position:absolute;left:600px;top:32px;width:600px;height:600px;z-index:3}
#ring{position:absolute;inset:0}
#ring text{font:700 13px var(--sans);letter-spacing:.2em;fill:color-mix(in srgb,#fff calc(var(--nv)*100%),var(--navy))}
#ring .tick{stroke:var(--gold);stroke-width:1.3}
#lensWrap{position:absolute;left:64px;top:64px;width:472px;height:472px;border-radius:50%;border:3px solid var(--gold);
  box-shadow:0 0 0 7px color-mix(in srgb,rgba(210,174,76,.18) calc(var(--nv)*100%),rgba(255,255,255,.6)),0 30px 60px -20px rgba(10,19,48,.55);overflow:hidden;background:#EDE6D6}
#lens{width:466px;height:466px;border-radius:50%}
#lensWrap::after{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 0 36px rgba(255,255,255,.35)}
.tag{position:absolute;right:-14px;top:284px;height:32px;padding:0 15px;border-radius:16px;background:var(--navy);color:var(--gold-hi);font-size:13.5px;font-weight:800;
  letter-spacing:.08em;display:flex;align-items:center;border:2px solid rgba(255,255,255,.7);z-index:4;font-variant-numeric:tabular-nums;white-space:nowrap}
.tag.red{background:var(--cinnabar);color:#fff}
.sticker{position:absolute;left:22px;top:70px;z-index:5;background:var(--cinnabar);color:#fff;border-radius:14px;padding:8px 14px 9px;font:800 15px var(--sans);letter-spacing:.04em;
  box-shadow:0 12px 24px -10px rgba(158,42,34,.8);transform-origin:80% 100%;white-space:nowrap}
.sticker small{display:block;font:700 22px/1 var(--zh);letter-spacing:.06em;margin-bottom:2px}
.sticker::after{content:"";position:absolute;right:26px;bottom:-9px;border:10px solid transparent;border-top-color:var(--cinnabar);border-bottom:0}

.copy{position:absolute;left:67px;top:150px;width:486px;display:flex;flex-direction:column;gap:14px;z-index:4}
.eb{display:flex;gap:10px;align-items:center;font-size:14px;font-weight:800;letter-spacing:.2em;color:var(--cinnabar-deep)}
.eb .n{min-width:28px;height:28px;padding:0 7px;border-radius:14px;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:12px;letter-spacing:0}
.nv .eb{color:var(--gold-hi)} .nv .eb .n{background:var(--cinnabar)}
.hl{font:400 48px/1.04 var(--serif);color:var(--navy);letter-spacing:-.012em}
.hl em{color:var(--cinnabar);font-style:italic}
.nv .hl{color:#E4E6F0} .nv .hl em{color:#F0806F}
.hl .arr{color:var(--gold);font:500 36px var(--sans);vertical-align:5px}
.bd{font-size:17px;line-height:1.45;color:var(--body);max-width:460px}
.nv .bd{color:#D6D9E8}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:28px;padding:0 12px;border:1.5px solid var(--navy);border-radius:14px;font-size:12.5px;font-weight:700;color:var(--navy);display:flex;align-items:center;background:rgba(255,255,255,.45)}
.nv .chip{border-color:#C9CDE0;color:#fff;background:transparent}
.chip.gold{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.chip.red{background:var(--cinnabar);border-color:var(--cinnabar);color:#fff}
.flag{align-self:flex-start;height:28px;padding:0 12px;background:var(--cinnabar);color:#fff;border-radius:5px;font-size:12.5px;font-weight:800;letter-spacing:.14em;display:flex;align-items:center}
.card{background:rgba(255,255,255,.78);border-radius:14px;padding:16px 18px;box-shadow:0 14px 34px -20px rgba(10,19,48,.45)}
.nv .card{background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.zh{font-family:var(--zh)}
.py{font-family:var(--serif);font-style:italic}

/* open */
#brush{width:486px;height:250px;margin:-14px 0 -6px -6px}
.pyrow{display:flex;gap:120px;margin:-6px 0 0 54px;font:italic 400 30px var(--serif);color:var(--gold-hi)}
/* case file */
.file{position:relative;display:grid;gap:0;padding:6px 18px 12px}
.file .row{display:grid;grid-template-columns:140px 1fr;gap:12px;padding:9px 0;border-top:1px solid rgba(19,33,90,.12);font-size:15.5px}
.file .row:first-child{border-top:0}
.file .k{font-size:11.5px;font-weight:800;letter-spacing:.16em;color:var(--cinnabar-deep);padding-top:3px}
.file .v{font-weight:600;color:var(--navy)}
.file .v b{font:500 22px var(--serif);font-variant-numeric:tabular-nums}
.filehead{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:800;letter-spacing:.18em;color:var(--body);padding:10px 0 6px;border-bottom:2px solid var(--navy)}
.seal{position:absolute;right:16px;top:58px;width:92px;height:92px;border:4px solid var(--cinnabar);border-radius:10px;color:var(--cinnabar);display:grid;place-items:center;text-align:center;
  font:700 30px/1.02 var(--zh);background:rgba(200,55,45,.06)}
.seal small{display:block;font:800 9px var(--sans);letter-spacing:.16em;margin-top:4px}
.note{font-size:11.5px;color:var(--body);opacity:.75;letter-spacing:.02em}
/* heritage */
.tl{display:grid;gap:0;position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:5px;top:12px;bottom:12px;width:2px;background:rgba(210,174,76,.35)}
.tli{display:grid;grid-template-columns:62px 1fr;gap:12px;align-items:center;padding:4px 0;position:relative}
.tli::before{content:"";position:absolute;left:-21px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:var(--navy-deep);border:2px solid var(--gold)}
.tli.on::before{background:var(--gold)}
.tli .c{font:700 34px/1 var(--zh);color:var(--gold-hi);text-align:center;white-space:nowrap}
.tli .c.two{font-size:24px}
.tli .y{font-size:11px;font-weight:800;letter-spacing:.16em;color:#F0806F}
.tli .t{font:500 18px/1.15 var(--serif);color:#fff}
.tli .d{font-size:12.5px;color:#C9CDE0;margin-top:1px}
/* tones */
.tones{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tone{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:center;background:rgba(255,255,255,.7);border-radius:12px;padding:10px 12px;box-shadow:0 8px 20px -16px rgba(10,19,48,.6)}
.tone .c{font:700 38px/1 var(--zh);color:var(--navy);text-align:center}
.tone .p{font:italic 500 26px/1 var(--serif)}
.tone .m{font-size:12px;font-weight:800;letter-spacing:.14em;color:var(--body);margin-top:4px}
.bridge{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--navy);color:#fff;border-radius:14px;padding:12px 16px}
.bridge .side{text-align:center}
.bridge .side b{display:block;font:500 22px var(--serif)}
.bridge .side small{font-size:10.5px;font-weight:800;letter-spacing:.16em;color:var(--gold-hi)}
.bridge svg{width:100%;height:40px}
.bridge p{grid-column:1/-1;font-size:13.5px;color:#D6D9E8;text-align:center}
/* words */
.words{display:grid;gap:10px}
.word{display:grid;grid-template-columns:92px 1fr auto;gap:14px;align-items:center;background:rgba(255,255,255,.72);border-radius:12px;padding:10px 16px;box-shadow:0 8px 20px -16px rgba(10,19,48,.6)}
.word .c{font:700 40px/1 var(--zh);color:var(--navy)}
.word .p{font:italic 500 30px/1 var(--serif);color:var(--cinnabar)}
.word .m{font-size:13px;font-weight:800;letter-spacing:.16em;color:var(--body)}
/* character tiles */
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.tile{background:rgba(255,255,255,.72);border-radius:12px;padding:10px 4px 9px;text-align:center;box-shadow:0 8px 20px -16px rgba(10,19,48,.6)}
.tile .c{font:700 40px/1.1 var(--zh);color:var(--navy)}
.tile .p{font:italic 500 19px var(--serif);color:var(--cinnabar)}
.tile .m{font-size:10.5px;font-weight:800;letter-spacing:.12em;color:var(--body)}
.formula{display:flex;gap:12px;align-items:center;justify-content:center;font:700 36px var(--zh);color:var(--navy)}
.formula span{font:500 26px var(--sans);color:var(--gold-deep)}
.formula em{font-style:normal;color:var(--cinnabar)}
/* speech */
.speech{display:grid;gap:4px;padding:14px 18px}
.sl{display:grid;gap:1px;padding:7px 0;border-top:1px solid rgba(19,33,90,.1)}
.sl:first-child{border-top:0}
.sl .c{font:700 28px/1.15 var(--zh);color:var(--navy)}
.sl .p{font:italic 500 19px var(--serif);color:var(--cinnabar)}
.sl .m{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--body)}
.stamp{position:absolute;right:-6px;top:-24px;width:118px;height:118px;border-radius:50%;background:var(--cinnabar);color:#fff;display:grid;place-items:center;text-align:center;
  font:700 30px/1 var(--zh);box-shadow:0 0 0 5px rgba(255,255,255,.8),0 16px 30px -10px rgba(158,42,34,.8)}
.stamp small{display:block;font:italic 500 15px var(--serif);margin-top:4px}
/* results */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:rgba(255,255,255,.75);border-radius:12px;padding:12px 6px 10px;text-align:center;box-shadow:0 8px 20px -16px rgba(10,19,48,.6)}
.stat b{display:block;font:500 46px/1 var(--serif);color:var(--navy);font-variant-numeric:tabular-nums}
.stat small{font-size:10.5px;font-weight:800;letter-spacing:.14em;color:var(--cinnabar-deep)}
/* outro */
.tagline{font-size:14.5px;font-weight:800;letter-spacing:.28em;color:var(--gold-deep)}
.pillb{align-self:flex-start;height:42px;padding:0 18px;border-radius:21px;display:flex;align-items:center;gap:9px;font-size:16px;font-weight:700}
.pillb.y{background:var(--gold);color:var(--navy)} .pillb.n{background:var(--navy);color:#fff}
.url{font-size:13.5px;color:var(--body)}
.bye{display:flex;gap:14px;align-items:center}
.bye .sq{width:62px;height:62px;border-radius:8px;background:var(--cinnabar);color:#fff;display:grid;place-items:center;font:700 22px/1.05 var(--zh);text-align:center}
.bye p{font:italic 400 24px var(--serif);color:var(--navy)}
.bye p small{display:block;font:700 12px var(--sans);font-style:normal;letter-spacing:.16em;color:var(--body)}

/* CTA + commentary */
.cta{position:absolute;left:67px;top:624px;width:486px;height:60px;border-radius:30px;display:flex;align-items:center;justify-content:space-between;padding:0 6px 0 26px;z-index:6;
  background:color-mix(in srgb,#fff calc(var(--nv)*100%),var(--navy));box-shadow:0 14px 30px -14px rgba(10,19,48,.6)}
.cta small{display:block;font-size:11.5px;font-weight:800;letter-spacing:.14em;color:color-mix(in srgb,var(--navy) calc(var(--nv)*100%),var(--gold-hi))}
.cta b{display:block;font-size:16.5px;font-weight:700;color:color-mix(in srgb,var(--navy) calc(var(--nv)*100%),#fff)}
.cta .call{height:48px;padding:0 20px;border-radius:24px;background:var(--gold);color:var(--navy);font-size:18.5px;font-weight:800;display:flex;gap:8px;align-items:center;font-variant-numeric:tabular-nums}
.cta svg,.pillb svg{width:19px;height:19px}
#comm{position:absolute;left:600px;top:624px;width:634px;height:60px;border-radius:30px;display:flex;align-items:center;gap:12px;padding:0 20px 0 8px;z-index:6;
  background:color-mix(in srgb,rgba(15,26,70,.82) calc(var(--nv)*100%),rgba(255,255,255,.9));box-shadow:0 14px 30px -16px rgba(10,19,48,.55);
  border:1px solid color-mix(in srgb,rgba(210,174,76,.35) calc(var(--nv)*100%),rgba(19,33,90,.08))}
.av{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font:700 21px var(--zh);position:relative}
.av.WEN{background:var(--cinnabar)} .av.SAM{background:var(--navy);font:800 18px var(--sans);border:2px solid var(--gold)}
.av.LRN{background:var(--gold);color:var(--navy);font:800 18px var(--sans)}
.who{font-size:10px;font-weight:800;letter-spacing:.16em;color:color-mix(in srgb,var(--gold-hi) calc(var(--nv)*100%),var(--cinnabar-deep));display:flex;gap:8px;align-items:center}
.who i{display:flex;gap:2px;align-items:flex-end;height:10px}
.who i u{display:block;width:2.5px;background:currentColor;border-radius:1px}
.cap{font-size:15px;line-height:1.28;font-weight:600;color:color-mix(in srgb,#fff calc(var(--nv)*100%),var(--ink));display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cap .py,.cap .zh{color:color-mix(in srgb,#F0806F calc(var(--nv)*100%),var(--cinnabar))}
#comm .txt{min-width:0;flex:1}
</style></head>
<body>
<div id="stage">
  <canvas id="bg" width="1920" height="1080"></canvas>
  <div class="lockup"><img src="../../../assets/img/crest-192.webp" alt=""><div><b>ROYAL CREST ACADEMY</b><small>BIKITA · MASVINGO</small></div></div>
  <div class="pill"><i>中</i>MANDARIN CONNECT</div>
  <div id="dial">
    <svg id="ring" viewBox="0 0 600 600">
      <defs><path id="rp" d="M300,300 m-272,0 a272,272 0 1,1 544,0 a272,272 0 1,1 -544,0"/></defs>
      <g id="ticks"></g>
      <text><textPath href="#rp" textLength="1700" lengthAdjust="spacing">MANDARIN CONNECT · 普通话 · ROYAL CREST ACADEMY · 你好 · SCIENCE · INNOVATION · SKILL · CASE STUDY 01 · 中文 ·</textPath></text>

<script src="timeline.js"></script>
<script src="strokes.js"></script>
<script>
const $=s=>document.querySelector(s);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const eo=x=>1-Math.pow(1-clamp(x),3);              // ease-out cubic
const eio=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const back=x=>{x=clamp(x);const c=1.6;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const lerp=(a,b,x)=>a+(b-a)*x;
const LINES=Object.fromEntries(TL.lines.map(l=>[l.id,l]));
const SCN=Object.fromEntries(TL.scenes.map(s=>[s.id,s]));
// absolute time of `sub` inside a line (start of line when absent)
function cue(id,sub,nth=0){const l=LINES[id]; if(!l) return 1e9; if(sub==null) return l.start;
  let i=-1; for(let k=0;k<=nth;k++){i=l.chars.indexOf(sub,i+1); if(i<0) return l.start}
  return l.start+(l.times[i]??0)}
const lend=id=>LINES[id].end;

/* ---------- image cache ---------- */
const IMG=new Map();
function img(src){let p=IMG.get(src); if(!p){p=new Promise(r=>{const im=new Image();im.onload=()=>r(im);im.onerror=()=>r(null);im.src=src});IMG.set(src,p);
  if(IMG.size>90){IMG.delete(IMG.keys().next().value)}} return p}
const fr=(dir,n)=>`../assets/${dir}/${String(n).padStart(4,'0')}.jpg`;

/* ---------- drawing helpers ---------- */
const S=720, C=S/2;
function cover(ctx,im,zoom=1,ox=0,oy=0,alpha=1){ if(!im) return; ctx.save();ctx.globalAlpha*=alpha;
  const s=S*zoom; ctx.drawImage(im,C-s/2+ox,C-s/2+oy,s,s); ctx.restore()}
async function clip(ctx,dir,f0,f1,u,zoom=1.04,alpha=1){ // u 0..1 across [f0,f1] with frame blending
  const x=lerp(f0,f1,clamp(u)); const a=Math.floor(x), b=Math.min(f1,a+1), k=x-a;
  const [ia,ib]=await Promise.all([img(fr(dir,a)),img(fr(dir,b))]);
  cover(ctx,ia,zoom,0,0,alpha); if(k>0.01) cover(ctx,ib,zoom,0,0,alpha*k)}
async function photo(ctx,src,u,z0=1.02,z1=1.1,alpha=1){cover(ctx,await img(src),lerp(z0,z1,clamp(u)),0,0,alpha)}

// Hanzi Writer stroke data → animated brush strokes (prog 0..1 over all strokes)
function drawChar(ctx,ch,x,y,size,prog,fill,opts={}){
  const d=STROKES[ch]; if(!d) return; const n=d.strokes.length; ctx.save();
  ctx.translate(x,y); ctx.scale(size/1024,size/1024); ctx.translate(0,900); ctx.scale(1,-1);
  if(opts.glow){ctx.shadowColor=opts.glow;ctx.shadowBlur=opts.blur||30}
  for(let i=0;i<n;i++){const p=clamp(prog*n-i); if(p<=0) break; const path=new Path2D(d.strokes[i]);
    if(p>=1){ctx.fillStyle=fill;ctx.fill(path);continue}
    ctx.save(); ctx.clip(path); const m=d.medians[i]; let L=0; const seg=[];

/* stylised learner face (Tendai) with pointers */
function drawFace(ctx,t){
  const g=ctx.createLinearGradient(0,0,0,S);g.addColorStop(0,'#F4ECDD');g.addColorStop(1,'#E8DCC6');ctx.fillStyle=g;ctx.fillRect(0,0,S,S);
  ctx.save();ctx.globalAlpha=.6;ctx.drawImage(GRAIN,0,0,S,S);ctx.restore();
  const bob=Math.sin(t*1.6)*4; ctx.save();ctx.translate(0,bob);
  // blazer + shirt + tie
  ctx.fillStyle='#13215a';ctx.beginPath();ctx.moveTo(90,720);ctx.bezierCurveTo(110,560,220,520,360,520);ctx.bezierCurveTo(500,520,610,560,630,720);ctx.fill();
  ctx.strokeStyle='#d2ae4c';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(250,540);ctx.lineTo(330,720);ctx.moveTo(470,540);ctx.lineTo(390,720);ctx.stroke();
  ctx.fillStyle='#EAF0F8';ctx.beginPath();ctx.moveTo(290,520);ctx.lineTo(360,640);ctx.lineTo(430,520);ctx.fill();
  ctx.fillStyle='#1d2c6b';ctx.beginPath();ctx.moveTo(345,545);ctx.lineTo(375,545);ctx.lineTo(385,700);ctx.lineTo(360,720);ctx.lineTo(335,700);ctx.fill();
  ctx.strokeStyle='#d2ae4c';ctx.lineWidth=4;for(let y=570;y<700;y+=34){ctx.beginPath();ctx.moveTo(338,y+14);ctx.lineTo(382,y);ctx.stroke()}
  // neck + head
  ctx.fillStyle='#6B4430';ctx.fillRect(320,440,80,100);
  ctx.fillStyle='#7A4E36';ctx.beginPath();ctx.ellipse(360,330,150,170,0,0,7);ctx.fill();
  ctx.beginPath();ctx.ellipse(212,340,26,40,0,0,7);ctx.ellipse(508,340,26,40,0,0,7);ctx.fill();
  // hair (short coils)
  ctx.fillStyle='#1E1512';ctx.beginPath();ctx.ellipse(360,225,152,92,0,Math.PI,0);ctx.lineTo(512,250);ctx.bezierCurveTo(470,200,250,200,208,250);ctx.fill();
  ctx.fillStyle='#2b201b';for(let i=0;i<70;i++){const a=Math.PI+(i/70)*Math.PI,r=120+((i*37)%30);ctx.beginPath();ctx.arc(360+Math.cos(a)*r,232+Math.sin(a)*r*.62,9,0,7);ctx.fill()}
  // eyes (blink)
  const bl=(t%4.2)<.12?.15:1; ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(300,335,34,24*bl,0,0,7);ctx.ellipse(420,335,34,24*bl,0,0,7);ctx.fill();
  ctx.fillStyle='#2A1A12';ctx.beginPath();ctx.arc(304,337,15*bl,0,7);ctx.arc(424,337,15*bl,0,7);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(309,331,4.5*bl,0,7);ctx.arc(429,331,4.5*bl,0,7);ctx.fill();
  ctx.strokeStyle='#1E1512';ctx.lineWidth=7;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(262,292);ctx.quadraticCurveTo(300,276,336,290);ctx.moveTo(384,290);ctx.quadraticCurveTo(420,276,458,292);ctx.stroke();
  // nose + mouth
  ctx.strokeStyle='#5A3626';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(360,350);ctx.quadraticCurveTo(352,392,340,400);ctx.quadraticCurveTo(360,412,382,400);ctx.stroke();
  ctx.fillStyle='#4A2418';ctx.beginPath();ctx.moveTo(312,440);ctx.quadraticCurveTo(360,488,408,440);ctx.quadraticCurveTo(360,458,312,440);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(322,444);ctx.quadraticCurveTo(360,462,398,444);ctx.quadraticCurveTo(360,452,322,444);ctx.fill();
  ctx.restore();
  // pointers
  const P=[['眼睛','yǎnjing',cue('l20','眼'),[[300,335],[420,335]],[150,240]],['鼻子','bízi',cue('l22','鼻'),[[360,388]],[150,480]],['嘴','zuǐ',cue('l22','嘴'),[[360,452]],[570,520]]];
  P.forEach(([c,p,a,pts,lab])=>{const k=eo((t-a)/.5); if(k<=0) return; const hot=Math.max(.35,1-Math.max(0,t-a-1.6)/1);
    ctx.save();ctx.globalAlpha=hot;pts.forEach(([x,y])=>{ctx.strokeStyle='#C8372D';ctx.lineWidth=5;ctx.beginPath();ctx.arc(x,y+bob,lerp(10,46,k),0,7);ctx.stroke()});
    ctx.strokeStyle='rgba(200,55,45,.8)';ctx.lineWidth=3;ctx.setLineDash([6,6]);ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]+bob);ctx.lineTo(lab[0],lab[1]);ctx.stroke();ctx.setLineDash([]);

/* pictograms for characters */
function pict(ctx,c,a){ctx.save();ctx.strokeStyle='#8a6a1c';ctx.lineWidth=16;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();
  const tree=(x,s)=>{ctx.moveTo(x,200*s+160);ctx.lineTo(x,560);ctx.moveTo(x-110*s,330);ctx.lineTo(x,250);ctx.lineTo(x+110*s,330);ctx.moveTo(x-90*s,560);ctx.lineTo(x,470);ctx.lineTo(x+90*s,560)};
  if(c==='人'){ctx.arc(330,230,40,0,7);ctx.moveTo(320,280);ctx.lineTo(270,560);ctx.moveTo(320,330);ctx.lineTo(450,560);ctx.moveTo(300,360);ctx.lineTo(220,420)}
  if(c==='口'){ctx.ellipse(C,C,170,120,0,0,7);ctx.moveTo(220,C);ctx.quadraticCurveTo(C,C+70,500,C)}
  if(c==='木'){tree(C,1)}
  if(c==='林'){tree(250,.7);tree(470,.7)}
  if(c==='日'){ctx.arc(C,C,170,0,7);ctx.moveTo(C+20,C);ctx.arc(C,C,20,0,7);for(let i=0;i<12;i++){const q=i/12*Math.PI*2;ctx.moveTo(C+Math.cos(q)*200,C+Math.sin(q)*200);ctx.lineTo(C+Math.cos(q)*240,C+Math.sin(q)*240)}}
  ctx.stroke();ctx.restore()}

/* ---------- build copy layers ---------- */
const ORDER=TL.scenes.map(s=>s.id);
ORDER.forEach(id=>{const s=SCN[id],d=SC[id]; const div=document.createElement('div'); div.className='copy'+(d.nv?' nv':''); div.id='c_'+id;
  if(d.top) div.style.top=d.top+'px';
  const items=d.copy(); div.innerHTML=items.map(x=>x[0]).join(''); [...div.children].forEach((el,i)=>{el.dataset.in=items[i][1]??(s.start+.35+i*.16)});
  div.style.opacity=0; $('#copies').appendChild(div)});

/* ---------- captions ---------- */
function chunks(l){const parts=l.cap.match(/[^.!?。！？]+[.!?。！？”’]*\s*/g)||[l.cap];const out=[];let cur='';
  for(const p of parts){if((cur+p).length>92&&cur){out.push(cur.trim());cur=p}else cur+=p} if(cur.trim())out.push(cur.trim());
  const tot=out.reduce((a,b)=>a+b.length,0);let acc=0,d=l.end-l.start;return out.map(txt=>{const st=l.start+d*acc/tot;acc+=txt.length;return{txt,st}})}
TL.lines.forEach(l=>l.ch=chunks(l));
const esc=s=>s.replace(/[&<]/g,c=>({'&':'&amp;','<':'&lt;'}[c]));
function fmtCap(s){return esc(s).replace(/([㐀-鿿！？。]+)/g,'<span class="zh">$1</span>').replace(/((?:[A-Za-z]*[āáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ][a-zāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ]*\s?)+)/g,'<span class="py">$1</span>')}
const NAMES={WEN:['文','WÉN LǍOSHĪ · 文老师'],SAM:['S','SAM · COMMENTARY'],LRN:['T','TENDAI · DAY 5 REPLAY']};

/* ---------- main render ---------- */
let lastCap='',lastScene='';
window.renderAt=async function(t){
  // scene weights (0.7s crossfades)
  const W={}; for(const s of TL.scenes){W[s.id]=clamp((t-s.start+.35)/.7)*clamp((s.end-t+.35)/.7)}
  let nv=0,ws=0,cta=0; for(const id of ORDER){nv+=W[id]*SC[id].nv;cta+=W[id]*SC[id].cta;ws+=W[id]} nv=ws?nv/ws:0; cta=ws?cta/ws:0;
  document.documentElement.style.setProperty('--nv',nv.toFixed(3));
  drawBg(t,nv);
  $('#ring').style.transform=`rotate(${t*3}deg)`;
  // dial entrance on open
  const o=SCN.open; const dk=eo((t-o.start-.1)/1.4); $('#dial').style.transform=`scale(${lerp(.86,1,dk)})`; $('#dial').style.opacity=dk;
  // copy layers
  for(const id of ORDER){const el=$('#c_'+id),w=W[id]; el.style.opacity=w; el.style.visibility=w>0?'visible':'hidden'; if(w<=0) continue;
    for(const c of el.children){const k=eo((t-c.dataset.in)/.7); c.style.opacity=k; c.style.translate=`0 ${(1-k)*16}px`}
    SC[id].update&&SC[id].update(t,SCN[id])}
  // lens
  const ctx=$('#lens').getContext('2d'); ctx.clearRect(0,0,S,S);
  const vis=ORDER.filter(id=>W[id]>0).sort((a,b)=>W[a]-W[b]);
  // draw outgoing fully, incoming on top with its weight
  const main=vis.reduce((a,b)=>W[b]>=(W[a]??-1)?b:a,vis[0]);
  for(const id of [...vis].sort((a,b)=>SCN[a].start-SCN[b].start)){
    const off=document.createElement('canvas'); off.width=off.height=S; const oc=off.getContext('2d');
    await SC[id].lens(oc,t,SCN[id]); ctx.globalAlpha=id===vis.sort((a,b)=>SCN[a].start-SCN[b].start)[0]?1:W[id]; ctx.drawImage(off,0,0); ctx.globalAlpha=1}
  // tag
  const tg=$('#tag'); tg.textContent=SC[main].tag(t); tg.classList.toggle('red',!!SC[main].red);
  // CTA
  $('#cta').style.opacity=cta; $('#cta').style.translate=`0 ${(1-cta)*20}px`;
  // commentary caption
  let L=null; for(const l of TL.lines){if(t>=l.start-.05&&t<l.end+.9)L=l}
  const comm=$('#comm'); const ok=!!L; comm.style.opacity=ok?1:clamp(1-(t-(TL.lines.filter(l=>l.end<t).pop()?.end??0)-.9)/.3);
  if(L){const who=L.learner?'LRN':L.who; const ch=L.ch.filter(c=>t>=c.st-.05).pop()||L.ch[0]; const key=L.id+ch.txt;
    if(key!==lastCap){$('#av').className='av '+who;$('#av').textContent=NAMES[who][0];$('#cap').innerHTML=fmtCap(ch.txt);lastCap=key}
    const talking=t<L.end; $('#who').innerHTML=NAMES[who][1]+(talking?'<i>'+[0,1,2,3].map(i=>`<u style="height:${3+7*Math.abs(Math.sin(t*11+i*1.9))}px"></u>`).join('')+'</i>':'');
    const k=eo((t-ch.st)/.35); $('#cap').style.opacity=k; $('#cap').style.translate=`0 ${(1-k)*6}px`}
  // "Wait / Hold on" sticker
  const st=$('#sticker'); let sk=0,stxt='';
  for(const l of TL.lines){const m=l.cap.match(/^(Wait|Hold on)/); if(!m) continue; const d=t-l.start; if(d>-.1&&d<2.2){sk=back(d/.35)*clamp((2.2-d)/.3);stxt=m[1]==='Wait'?(l.cap.includes('hear')?'WAIT, DID YOU HEAR THAT?':'WAIT, WHAT?'):'HOLD ON!'}}
  st.style.opacity=clamp(sk); st.style.transform=`rotate(-6deg) scale(${lerp(.4,1,clamp(sk,0,1.2))})`; if(stxt) st.lastChild.textContent=stxt;
};
