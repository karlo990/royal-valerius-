<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Biology — stage</title>
<style>
@font-face{font-family:"Newsreader";font-style:normal;font-weight:200 800;src:url(../../../assets/fonts/newsreader-latin.woff2) format("woff2"),url(../../../assets/fonts/newsreader-latin-ext.woff2) format("woff2")}
@font-face{font-family:"Newsreader";font-style:italic;font-weight:200 800;src:url(../../../assets/fonts/newsreader-italic-latin.woff2) format("woff2"),url(../../../assets/fonts/newsreader-italic-latin-ext.woff2) format("woff2")}
@font-face{font-family:"Plus Jakarta Sans";font-weight:400 800;src:url(../../../assets/fonts/plus-jakarta-sans-latin.woff2) format("woff2"),url(../../../assets/fonts/plus-jakarta-sans-latin-ext.woff2) format("woff2")}
@font-face{font-family:"Plex Mono";font-weight:400;src:url(../../assets/fonts/IBMPlexMono-Regular.woff2) format("woff2")}
@font-face{font-family:"Plex Mono";font-weight:600;src:url(../../assets/fonts/IBMPlexMono-SemiBold.woff2) format("woff2")}
:root{
  /* Technical Graphics edition: repo navy/gold on drafting paper, blueprint cyan as the lesson accent */
  --paper:#F3F5F8; --navy:#13215a; --navy-deep:#0a1330; --ink:#0b1533; --gold:#d2ae4c; --gold-hi:#e2c26a; --gold-deep:#8a6a1c;
  --cyan:#0E8F86; --cyan-deep:#0B6E68; --cyan-hi:#6FE0D2; --body:#3a3f55;
  --serif:"Newsreader",Georgia,serif; --sans:"Plus Jakarta Sans",system-ui,sans-serif; --mono:"Plex Mono",ui-monospace,monospace;
  --nv:0;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1280px;height:720px;overflow:hidden;background:#000}
#stage{position:relative;width:1280px;height:720px;overflow:hidden;font-family:var(--sans);color:var(--ink)}
canvas{display:block}
#bg{position:absolute;inset:0;width:1280px;height:720px}
.lockup{position:absolute;left:50px;top:28px;display:flex;gap:12px;align-items:center;z-index:6}
.lockup img{width:46px;height:46px;object-fit:contain}
.lockup b{display:block;font-size:17px;font-weight:800;letter-spacing:.11em;color:color-mix(in srgb,#fff calc(var(--nv)*100%),var(--navy))}
.lockup small{display:block;font-size:13px;font-weight:700;letter-spacing:.12em;color:color-mix(in srgb,var(--gold) calc(var(--nv)*100%),var(--cyan))}
.pill{position:absolute;right:46px;top:36px;height:36px;padding:0 16px 0 6px;border-radius:18px;background:var(--navy);color:#fff;display:flex;gap:9px;align-items:center;
  font-size:13.5px;font-weight:800;letter-spacing:.12em;box-shadow:0 8px 20px -8px rgba(10,19,48,.7);z-index:6;border:1.5px solid color-mix(in srgb,var(--gold) calc(var(--nv)*100%),transparent)}
.pill i{width:26px;height:26px;border-radius:50%;background:var(--gold);display:grid;place-items:center}
.pill i svg{width:15px;height:15px}
#dial{position:absolute;left:600px;top:32px;width:600px;height:600px;z-index:3}
#ring{position:absolute;inset:0}
#ring text{font:700 13px var(--sans);letter-spacing:.2em;fill:color-mix(in srgb,#fff calc(var(--nv)*100%),var(--navy))}
#ring .tick{stroke:var(--gold);stroke-width:1.3}
#lensWrap{position:absolute;left:64px;top:64px;width:472px;height:472px;border-radius:50%;border:3px solid var(--gold);
  box-shadow:0 0 0 7px color-mix(in srgb,rgba(210,174,76,.18) calc(var(--nv)*100%),rgba(255,255,255,.6)),0 30px 60px -20px rgba(10,19,48,.55);overflow:hidden;background:#E9EDF2}
#lens{width:466px;height:466px;border-radius:50%}
#lensWrap::after{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 0 36px rgba(255,255,255,.3)}
.tag{position:absolute;right:-14px;top:284px;height:32px;padding:0 15px;border-radius:16px;background:var(--navy);color:var(--gold-hi);font-size:13.5px;font-weight:800;
  letter-spacing:.08em;display:flex;align-items:center;border:2px solid rgba(255,255,255,.7);z-index:4;font-variant-numeric:tabular-nums;white-space:nowrap}
.tag.cy{background:var(--cyan);color:#fff}
.sticker{position:absolute;left:22px;top:70px;z-index:5;background:var(--gold);color:var(--navy);border-radius:14px;padding:8px 14px 9px;font:800 15px var(--sans);letter-spacing:.04em;
  box-shadow:0 12px 24px -10px rgba(138,106,28,.8);transform-origin:80% 100%;white-space:nowrap}
.sticker small{display:block;font:800 22px/1 var(--sans);letter-spacing:.06em;margin-bottom:2px}
.sticker::after{content:"";position:absolute;right:26px;bottom:-9px;border:10px solid transparent;border-top-color:var(--gold);border-bottom:0}

.copy{position:absolute;left:67px;top:150px;width:486px;display:flex;flex-direction:column;gap:14px;z-index:4}
.eb{display:flex;gap:10px;align-items:center;font-size:14px;font-weight:800;letter-spacing:.2em;color:var(--cyan-deep)}
.eb .n{min-width:28px;height:28px;padding:0 7px;border-radius:14px;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:12px;letter-spacing:0}
.nv .eb{color:var(--gold-hi)} .nv .eb .n{background:var(--cyan)}
.hl{font:400 48px/1.04 var(--serif);color:var(--navy);letter-spacing:-.012em}
.hl em{color:var(--cyan);font-style:italic}
.nv .hl{color:#E4E6F0} .nv .hl em{color:var(--cyan-hi)}
.hl .arr{color:var(--gold);font:500 36px var(--sans);vertical-align:5px}
.bd{font-size:17px;line-height:1.45;color:var(--body);max-width:460px}
.nv .bd{color:#D6D9E8}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:28px;padding:0 12px;border:1.5px solid var(--navy);border-radius:14px;font-size:12.5px;font-weight:700;color:var(--navy);display:flex;align-items:center;background:rgba(255,255,255,.55)}
.nv .chip{border-color:#C9CDE0;color:#fff;background:transparent}
.chip.gold{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.chip.cy{background:var(--cyan);border-color:var(--cyan);color:#fff}
.flag{align-self:flex-start;height:28px;padding:0 12px;background:var(--cyan);color:#fff;border-radius:5px;font-size:12.5px;font-weight:800;letter-spacing:.14em;display:flex;align-items:center}
.card{background:rgba(255,255,255,.82);border-radius:14px;padding:14px 18px;box-shadow:0 14px 34px -20px rgba(10,19,48,.45)}
.nv .card{background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.k{font:600 11px var(--mono);letter-spacing:.08em;color:var(--cyan-deep)}
/* first line */
#firstline{width:486px;height:46px}
/* line types */
.ltypes{display:grid;gap:4px;padding:10px 18px}
.lt{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center;padding:6px 0;border-top:1px solid rgba(19,33,90,.1)}
.lt:first-child{border-top:0}
.lt svg{width:150px;height:14px;overflow:visible}
.lt b{font-size:15px;color:var(--navy)} .lt small{display:block;font-size:12.5px;color:var(--body)}
/* rows (views, VPs, BIM) */
.rows{display:grid;gap:0;padding:8px 18px}
.row{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:8px 0;border-top:1px solid rgba(19,33,90,.1)}
.row:first-child{border-top:0}
.row i{width:12px;height:12px;border-radius:50%;background:var(--gold)}
.row i.up{background:#D9473C} .row i.down{background:#3F8FD0} .row i.cy{background:var(--cyan)}
.row b{font-size:15px;color:var(--navy)} .row small{display:block;font-size:12.5px;color:var(--body)}
/* iso axes */
.axes{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center;padding:12px 18px}
.axes svg{width:150px;height:110px}
.axes p{font-size:14px;color:var(--body);line-height:1.45}
.axes p b{color:var(--navy)}
/* BIM card */
.bim{display:grid;gap:0;padding:10px 18px;min-height:206px}
.bim .hd{display:flex;justify-content:space-between;align-items:center;padding-bottom:6px;border-bottom:2px solid var(--navy);font-size:12px;font-weight:800;letter-spacing:.16em;color:var(--navy)}
.bim .hd span{font:600 11px var(--mono);color:var(--cyan-deep);letter-spacing:.04em}
.bim dl{display:grid;gap:0}
.bim dl div{display:grid;grid-template-columns:190px 1fr;gap:10px;padding:6px 0;border-top:1px solid rgba(19,33,90,.1);font-size:14px}
.bim dl div:first-child{border-top:0}
.bim dt{color:var(--body);font-weight:600} .bim dd{color:var(--navy);font-weight:700;font-variant-numeric:tabular-nums}
.bim dd code{font:600 12.5px var(--mono);color:var(--cyan-deep)}
.bim dd big{font:500 26px var(--serif)}
/* careers */
.jobs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.job{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center;background:rgba(255,255,255,.82);border-radius:12px;padding:9px 12px;box-shadow:0 8px 20px -16px rgba(10,19,48,.6)}
.job svg{width:34px;height:34px}
.job b{font-size:14px;line-height:1.2;color:var(--navy)}
.note{font-size:12px;color:var(--body);opacity:.8}
/* outro */
.tagline{font-size:14.5px;font-weight:800;letter-spacing:.28em;color:var(--gold-deep)}
.pillb{align-self:flex-start;height:42px;padding:0 18px;border-radius:21px;display:flex;align-items:center;gap:9px;font-size:16px;font-weight:700}
.pillb.y{background:var(--gold);color:var(--navy)} .pillb.n{background:var(--navy);color:#fff}
.url{font-size:13.5px;color:var(--body)}
.sign{font:italic 400 30px/1.1 var(--serif);color:var(--navy)} .sign em{color:var(--cyan)}

/* biology */
.bpL{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:6px;color:#fff;font:700 14px var(--mono);margin-right:3px}
.pair{display:flex;align-items:center;gap:4px} .pair i{font-style:normal;color:var(--body);font-weight:700}
.row.bp{grid-template-columns:auto 1fr}
.big{font:500 44px/1 var(--serif);color:var(--navy);font-variant-numeric:tabular-nums} .big small{font:700 13px var(--sans);letter-spacing:.14em;color:var(--cyan-deep);text-transform:uppercase}
.cmp{display:grid;padding:10px 18px}
.cmp .ch,.cmp .cr{display:grid;grid-template-columns:86px 1fr 1fr;gap:10px;align-items:center;padding:8px 0}
.cmp .ch{border-bottom:2px solid var(--navy);font-size:14px;letter-spacing:.14em;color:var(--navy)} .cmp .ch .r{color:#7A3FC0}
.cmp .cr{border-top:1px solid rgba(19,33,90,.1);font-size:14.5px} .cmp .cr:nth-child(2){border-top:0}
.cmp .cr span{font:600 11px var(--mono);letter-spacing:.08em;color:var(--cyan-deep);text-transform:uppercase}
.cmp .cr em{font-style:normal;font-weight:700;color:var(--navy)} .cmp .cr em.r{color:#7A3FC0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two .card{padding:12px 14px;border-top:4px solid} .two .card b{display:block;font-size:15px;color:var(--navy);margin-bottom:3px} .two .card small{font-size:12.5px;line-height:1.4;color:var(--body);display:block}
.nv .row b{color:#EEF0F7} .nv .row small{color:#C9CDE0} .nv .row{border-top-color:rgba(255,255,255,.12)}
.card.g{border-color:#2EAD6B} .card.h{border-color:#D9473C}
.jobs{display:flex;flex-wrap:wrap;gap:8px}
.job{display:flex;align-items:center;height:38px;padding:0 16px;font-size:15px;font-weight:700;color:var(--navy);grid-template-columns:none}
.portrait .two .card small{font-size:13.5px}
/* portrait 9:16 layout (720×1280 logical → 1080×1920) */
html.portrait,html.portrait body{width:720px;height:1280px}
.portrait #stage{width:720px;height:1280px}
.portrait #bg{width:720px;height:1280px}
.portrait #dial{left:60px;top:118px}
.portrait .copy{top:690px!important;width:586px}
.portrait .bd{max-width:586px}
.portrait .hl{font-size:46px}
.portrait #comm{left:67px;top:1110px;width:586px}
.portrait .cta{top:1188px;width:586px}
.portrait .pill{top:34px}
.portrait #firstline{width:586px}
/* CTA + commentary */
.cta{position:absolute;left:67px;top:624px;width:486px;height:60px;border-radius:30px;display:flex;align-items:center;justify-content:space-between;padding:0 6px 0 26px;z-index:6;
  background:color-mix(in srgb,#fff calc(var(--nv)*100%),var(--navy));box-shadow:0 14px 30px -14px rgba(10,19,48,.6)}
.cta small{display:block;font-size:11.5px;font-weight:800;letter-spacing:.14em;color:color-mix(in srgb,var(--navy) calc(var(--nv)*100%),var(--gold-hi))}
.cta b{display:block;font-size:16.5px;font-weight:700;color:color-mix(in srgb,var(--navy) calc(var(--nv)*100%),#fff)}
.cta .call{height:48px;padding:0 20px;border-radius:24px;background:var(--gold);color:var(--navy);font-size:18.5px;font-weight:800;display:flex;gap:8px;align-items:center;font-variant-numeric:tabular-nums}
.cta svg,.pillb svg{width:19px;height:19px}
#comm{position:absolute;left:600px;top:624px;width:634px;height:60px;border-radius:30px;display:flex;align-items:center;gap:12px;padding:0 20px 0 8px;z-index:6;
  background:color-mix(in srgb,rgba(10,30,60,.82) calc(var(--nv)*100%),rgba(255,255,255,.92));box-shadow:0 14px 30px -16px rgba(10,19,48,.55);
  border:1px solid color-mix(in srgb,rgba(210,174,76,.35) calc(var(--nv)*100%),rgba(19,33,90,.08))}
.av{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font:800 18px var(--sans);position:relative}
.av.RUD{background:var(--cyan)} .av.SAM{background:var(--navy);border:2px solid var(--gold)}
.who{font-size:10px;font-weight:800;letter-spacing:.16em;color:color-mix(in srgb,var(--gold-hi) calc(var(--nv)*100%),var(--cyan-deep));display:flex;gap:8px;align-items:center}
.who i{display:flex;gap:2px;align-items:flex-end;height:10px}
.who i u{display:block;width:2.5px;background:currentColor;border-radius:1px}
.cap{font-size:15px;line-height:1.28;font-weight:600;color:color-mix(in srgb,#fff calc(var(--nv)*100%),var(--ink));display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#comm .txt{min-width:0;flex:1}
</style></head>

<script>
const $=s=>document.querySelector(s);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const eo=x=>1-Math.pow(1-clamp(x),3);
const eio=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const back=x=>{x=clamp(x);const c=1.6;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const lerp=(a,b,x)=>a+(b-a)*x;
const LINES=Object.fromEntries(TL.lines.map(l=>[l.id,l]));
const SCN=Object.fromEntries(TL.scenes.map(s=>[s.id,s]));
function cue(id,sub,nth=0){const l=LINES[id]; if(!l) return 1e9; if(sub==null) return l.start;
  let i=-1; for(let k=0;k<=nth;k++){i=l.chars.indexOf(sub,i+1); if(i<0) return l.start}
  return l.start+(l.times[i]??0)}
const lend=id=>LINES[id].end;
const PORTRAIT=location.search.includes('portrait'); if(PORTRAIT) document.documentElement.classList.add('portrait');

/* ---------- images and clips ---------- */
const IMG=new Map();
function img(src){let p=IMG.get(src); if(!p){p=new Promise(r=>{const im=new Image();im.onload=()=>r(im);im.onerror=()=>r(null);im.src=src});IMG.set(src,p);
  if(IMG.size>90){IMG.delete(IMG.keys().next().value)}} return p}
const fr=(dir,n)=>`../assets/${dir}/${String(n).padStart(4,'0')}.jpg`;
const S=720, C=S/2;
function cover(ctx,im,zoom=1,ox=0,oy=0,alpha=1){ if(!im) return; ctx.save();ctx.globalAlpha*=alpha;
  const s=S*zoom; ctx.drawImage(im,C-s/2+ox,C-s/2+oy,s,s); ctx.restore()}
async function clip(ctx,dir,f0,f1,u,zoom=1.04,alpha=1){
  const x=lerp(f0,f1,clamp(u)); const a=Math.floor(x), b=Math.min(Math.max(f0,f1),a+1), k=x-a;
  const [ia,ib]=await Promise.all([img(fr(dir,a)),img(fr(dir,b))]);
  cover(ctx,ia,zoom,0,0,alpha); if(k>0.01) cover(ctx,ib,zoom,0,0,alpha*k)}
function layer(){const c=document.createElement('canvas');c.width=c.height=S;return{c,g:c.getContext('2d')}}
async function photo(ctx,src,u,z0=1.02,z1=1.1,alpha=1){cover(ctx,await img(src),lerp(z0,z1,clamp(u)),0,0,alpha)}
// crossfade between two lens drawings around time `at`
async function xfade(ctx,t,at,dur,drawA,drawB){const k=eio((t-at)/dur);
  if(k<=0){await drawA(ctx);return} if(k>=1){await drawB(ctx);return}
  await drawA(ctx); const o=layer(); await drawB(o.g); ctx.globalAlpha=k; ctx.drawImage(o.c,0,0); ctx.globalAlpha=1}

/* ---------- drafting helpers ---------- */
const INK='#1B2440', CY='#1B7FAE', GUIDE='rgba(27,127,174,.35)', PAPER='#FBFCFD';
function sheet(ctx,grid=true){ctx.fillStyle=PAPER;ctx.fillRect(0,0,S,S);
  if(grid){ctx.lineWidth=1;for(let i=0;i<=S;i+=24){ctx.strokeStyle=i%120===0?'rgba(27,127,174,.13)':'rgba(27,127,174,.06)';
    ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,S);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(S,i);ctx.stroke()}}}
function blueprint(ctx){ctx.fillStyle='#0F4A6E';ctx.fillRect(0,0,S,S);ctx.lineWidth=1;
  for(let i=0;i<=S;i+=24){ctx.strokeStyle=i%120===0?'rgba(255,255,255,.14)':'rgba(255,255,255,.06)';ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,S);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(S,i);ctx.stroke()}}
// partial line a→b at progress p, drafting styles
function ln(ctx,a,b,p,st={}){p=clamp(p);if(p<=0)return;ctx.save();ctx.strokeStyle=st.col||INK;ctx.lineWidth=st.w||2;ctx.lineCap='round';
  if(st.dash)ctx.setLineDash(st.dash);ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(lerp(a[0],b[0],p),lerp(a[1],b[1],p));ctx.stroke();ctx.restore()}

/* ---------- copy layers ---------- */
const ORDER=TL.scenes.map(s=>s.id);
ORDER.forEach(id=>{const s=SCN[id],d=SC[id]; const div=document.createElement('div'); div.className='copy'+(d.nv?' nv':''); div.id='c_'+id;
  if(d.top&&!PORTRAIT) div.style.top=d.top+'px';
  const items=d.copy(); div.innerHTML=items.map(x=>x[0]).join(''); [...div.children].forEach((el,i)=>{el.dataset.in=items[i][1]??(s.start+.35+i*.16)});
  div.style.opacity=0; $('#copies').appendChild(div)});

/* ---------- captions ---------- */
function chunks(l){const parts=l.cap.match(/[^.!?]+[.!?”’]*\s*/g)||[l.cap];const out=[];let cur='';
  for(const p of parts){if((cur+p).length>92&&cur){out.push(cur.trim());cur=p}else cur+=p} if(cur.trim())out.push(cur.trim());
  const tot=out.reduce((a,b)=>a+b.length,0);let acc=0,d=l.end-l.start;return out.map(txt=>{const st=l.start+d*acc/tot;acc+=txt.length;return{txt,st}})}
TL.lines.forEach(l=>l.ch=chunks(l));
const esc=s=>s.replace(/[&<]/g,c=>({'&':'&amp;','<':'&lt;'}[c]));
const NAMES={RUD:['R','TEACHER RUDO · BIOLOGY'],SAM:['S','SAM · COMMENTARY']};

/* ---------- main render ---------- */
let lastCap='';
window.renderAt=async function(t){
  const W={}; for(const s of TL.scenes){W[s.id]=clamp((t-s.start+.35)/.7)*clamp((s.end-t+.35)/.7)}
  let nv=0,ws=0,cta=0; for(const id of ORDER){nv+=W[id]*SC[id].nv;cta+=W[id]*SC[id].cta;ws+=W[id]} nv=ws?nv/ws:0; cta=ws?cta/ws:0;
  document.documentElement.style.setProperty('--nv',nv.toFixed(3));
  drawBg(t,nv);
  $('#ring').style.transform=`rotate(${t*3}deg)`;
  const o=SCN.open; const dk=eo((t-o.start-.1)/1.4); $('#dial').style.transform=`scale(${DS*lerp(.86,1,dk)})`; $('#dial').style.opacity=dk;
  for(const id of ORDER){const el=$('#c_'+id),w=W[id]; el.style.opacity=w; el.style.visibility=w>0?'visible':'hidden'; if(w<=0) continue;
    for(const c of el.children){const k=eo((t-c.dataset.in)/.7); c.style.opacity=k; c.style.translate=`0 ${(1-k)*16}px`}
    SC[id].update&&SC[id].update(t,SCN[id])}
  const ctx=$('#lens').getContext('2d'); ctx.clearRect(0,0,S,S);
  const vis=ORDER.filter(id=>W[id]>0);
  const main=vis.reduce((a,b)=>W[b]>=(W[a]??-1)?b:a,vis[0]);
  let acc=0;
  for(const id of [...vis].sort((a,b)=>SCN[a].start-SCN[b].start)){
    const o=layer(); await SC[id].lens(o.g,t,SCN[id]); acc+=W[id];
    ctx.globalAlpha=acc>0?W[id]/acc:1; ctx.drawImage(o.c,0,0); ctx.globalAlpha=1}
  const tg=$('#tag'); tg.textContent=SC[main].tag(t); tg.classList.toggle('cy',main==='dna'||main==='rna'||main==='virus');
  $('#cta').style.opacity=cta; $('#cta').style.translate=`0 ${(1-cta)*20}px`;
  let L=null; for(const l of TL.lines){if(t>=l.start-.05&&t<l.end+.9)L=l}
  const comm=$('#comm'); comm.style.opacity=L?1:clamp(1-(t-(TL.lines.filter(l=>l.end<t).pop()?.end??0)-.9)/.3);
  if(L){const who=L.who; const ch=L.ch.filter(c=>t>=c.st-.05).pop()||L.ch[0]; const key=L.id+ch.txt;
    if(key!==lastCap){$('#av').className='av '+who;$('#av').textContent=NAMES[who][0];$('#cap').innerHTML=esc(ch.txt);lastCap=key}
    const talking=t<L.end; $('#who').innerHTML=NAMES[who][1]+(talking?'<i>'+[0,1,2,3].map(i=>`<u style="height:${3+7*Math.abs(Math.sin(t*11+i*1.9))}px"></u>`).join('')+'</i>':'');
    const k=eo((t-ch.st)/.35); $('#cap').style.opacity=k; $('#cap').style.translate=`0 ${(1-k)*6}px`}
  const st=$('#sticker'); let sk=0,stxt='';
  for(const l of TL.lines){if(!/^Wait/.test(l.cap)) continue; const d=t-l.start; if(d>-.1&&d<2.2){sk=back(d/.35)*clamp((2.2-d)/.3);stxt=l.cap.includes('metres')?'2 METRES IN ONE CELL?':l.cap.includes('nucleus')?'NO NUCLEUS?':'ANTIBIOTICS DON’T WORK?'}}
  st.style.opacity=clamp(sk); st.style.transform=`rotate(-6deg) scale(${lerp(.4,1,clamp(sk,0,1.2))})`; if(stxt) st.lastChild.textContent=stxt;
};
