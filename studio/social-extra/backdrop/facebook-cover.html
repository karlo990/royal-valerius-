<!doctype html><html><head><meta charset="utf-8">
<title>Royal Crest Facebook cover</title>
<style>
/* Facebook Page cover, 1640 × 924. Mobile shows all of it; desktop crops to the middle 1640 × 624,
   so everything that matters sits inside the dashed safe band (y 150–774). On phones the round profile
   photo (the crest) covers the bottom-left, so the text sits in the right half. */
@font-face{font-family:RcSerif;font-weight:400 700;src:url(../../../assets/fonts/newsreader-latin.woff2) format("woff2")}
@font-face{font-family:RcSerif;font-style:italic;font-weight:400 700;src:url(../../../assets/fonts/newsreader-italic-latin.woff2) format("woff2")}
@font-face{font-family:RcSans;font-weight:200 800;src:url(../../../assets/fonts/plus-jakarta-sans-latin.woff2) format("woff2")}
:root{--navy:#0a1f5c;--gold:#c9a227;--gold-deep:#a8841a;--gold2:#f2b705}
html,body{margin:0;background:#fff}
#cv{position:relative;width:1640px;height:924px;overflow:hidden;background:#fff}
#wall{position:absolute;inset:0;opacity:.13}
.u{position:absolute;display:flex;align-items:center;gap:12px;transform:translate(-50%,-50%);white-space:nowrap}
.u img{height:100px} .u b{display:block;font:500 37px/.92 RcSerif,serif;color:var(--navy)} .u b em{display:block;font-style:italic;color:var(--gold)}
/* white glow behind the lockup so the wall reads as texture */
#glow{position:absolute;left:1190px;top:450px;width:1100px;height:640px;transform:translate(-50%,-50%);background:radial-gradient(closest-side,#fff 62%,rgba(255,255,255,0))}
#main{position:absolute;left:800px;top:440px;transform:translateY(-50%);display:flex;align-items:center;gap:44px;white-space:nowrap}
#main>img{height:300px;filter:drop-shadow(0 18px 26px rgba(10,31,92,.25))}
#main h1{margin:0;font:500 112px/.9 RcSerif,serif;color:var(--navy);letter-spacing:-.015em}
#main h1 em{font-style:italic;color:var(--gold)}
#main .tag{margin-top:18px;font:800 22px RcSans,sans-serif;letter-spacing:.32em;color:var(--gold-deep)}
#main .row{display:flex;gap:14px;margin-top:26px}
#main .pill{height:58px;padding:0 26px;border-radius:29px;display:flex;align-items:center;gap:12px;font:800 25px RcSans,sans-serif}
#main .pill.n{background:var(--navy);color:#fff} #main .pill.y{background:var(--gold2);color:var(--navy)}
#main .pill svg{width:26px;height:26px}
.bar{position:absolute;left:0;right:0;height:14px;background:var(--navy)} .bar.t{top:0;border-bottom:5px solid var(--gold)} .bar.b{bottom:0;border-top:5px solid var(--gold)}
body.guides #cv::before{content:"";position:absolute;left:35px;top:360px;width:740px;height:740px;border-radius:50%;background:rgba(220,40,40,.25);z-index:9}
body.guides #cv::after{content:"";position:absolute;left:0;right:0;top:150px;height:624px;outline:3px dashed #e33;pointer-events:none}
</style></head><body>
<div id="cv">
  <div id="wall"></div><div id="glow"></div>
  <div id="main">
    <div><h1>Royal Crest<br><em>Academy</em></h1>
      <div class="tag">SCIENCE · INNOVATION · SKILL</div>
      <div class="row"><div class="pill y">Form 1 · 2027 intake open</div>
        <div class="pill n"><svg viewBox="0 0 24 24" fill="none" stroke="#f2b705" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>0714 404 090</div></div>
    </div></div>
  <div class="bar t"></div><div class="bar b"></div>
</div>
<script>
if(location.search.includes('guides'))document.body.classList.add('guides');
// the same staggered crest wall as the 3 m backdrop, at a smaller scale
const W=document.getElementById('wall'),U=`<img src="../../assets/brand/crest-640.webp" alt=""><div><b>Royal Crest <em>Academy</em></b></div>`;
for(let r=0,y=80;y<1000;y+=170,r++)for(let c=-1;c<5;c++){const d=document.createElement('div');d.className='u';d.innerHTML=U;d.style.left=(c*420+(r%2?210:0)+120)+'px';d.style.top=y+'px';W.appendChild(d)}
</script>
</body></html>
