<!doctype html><html><head><meta charset="utf-8">
<title>Bakery film — style frames</title>
<style>
@font-face{font-family:"Newsreader";font-style:normal;font-weight:200 800;src:url(../../../assets/fonts/newsreader-latin.woff2) format("woff2")}
@font-face{font-family:"Newsreader";font-style:italic;font-weight:200 800;src:url(../../../assets/fonts/newsreader-italic-latin.woff2) format("woff2")}
@font-face{font-family:"Plus Jakarta Sans";font-weight:400 800;src:url(../../../assets/fonts/plus-jakarta-sans-latin.woff2) format("woff2")}
@font-face{font-family:"Plex Mono";font-weight:400;src:url(../../assets/fonts/IBMPlexMono-Regular.woff2) format("woff2")}
@font-face{font-family:"Plex Mono";font-weight:600;src:url(../../assets/fonts/IBMPlexMono-SemiBold.woff2) format("woff2")}
:root{--rasp:#C8436B;--rasp-deep:#8E2A47;--gold:#E2B93B;--gold-hi:#F5D57A;--navy:#13215a;--choc:#1A0E08;--cream:#FBF5EC;--ink:#2A1A12;
  --serif:"Newsreader",serif;--sans:"Plus Jakarta Sans",sans-serif;--mono:"Plex Mono",monospace}
*{box-sizing:border-box}html,body{margin:0;background:#000}
#f{position:relative;width:1280px;height:720px;overflow:hidden;font-family:var(--sans)}
#f canvas.full{position:absolute;inset:0;width:1280px;height:720px}
.lay{position:absolute;inset:0}
/* VFX finishing layers */
#leak{mix-blend-mode:screen;pointer-events:none}
#vig{background:radial-gradient(120% 95% at 50% 45%,transparent 55%,rgba(0,0,0,.55) 100%);pointer-events:none}
.light #vig{background:radial-gradient(120% 95% at 50% 45%,transparent 60%,rgba(90,54,38,.22) 100%)}
#grain{opacity:.10;mix-blend-mode:overlay;pointer-events:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1.4 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
/* chrome */
.lock{position:absolute;left:44px;top:30px;display:flex;align-items:center;gap:12px;color:#fff;z-index:5}
.lock img{width:40px}.lock b{display:block;font-size:14px;letter-spacing:.14em;font-weight:800}.lock small{display:block;font-size:10.5px;letter-spacing:.16em;font-weight:700;color:var(--gold-hi)}
.light .lock{color:var(--navy)}.light .lock small{color:var(--rasp)}
.rail{position:absolute;left:360px;right:220px;top:38px;display:grid;grid-template-columns:repeat(7,1fr);gap:6px;z-index:5}
.rail div{font:600 9.5px var(--mono);letter-spacing:.08em;color:rgba(255,255,255,.55);padding-top:9px;position:relative;white-space:nowrap}
.rail div::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;border-radius:2px;background:rgba(255,255,255,.18)}
.rail div.done::before{background:rgba(226,185,59,.7)}.rail div.on{color:#fff}.rail div.on::before{background:linear-gradient(90deg,var(--gold) 62%,rgba(255,255,255,.18) 62%)}
.light .rail div{color:rgba(42,26,18,.45)}.light .rail div::before{background:rgba(42,26,18,.12)}.light .rail div.on{color:var(--ink)}.light .rail div.done::before{background:var(--rasp)}
.light .rail div.on::before{background:linear-gradient(90deg,var(--rasp) 62%,rgba(42,26,18,.12) 62%)}
.pill{position:absolute;right:44px;top:28px;height:34px;padding:0 16px 0 6px;border-radius:17px;display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(10px);color:#fff;font-size:12.5px;font-weight:800;letter-spacing:.16em;z-index:5}
.pill i{width:24px;height:24px;border-radius:50%;background:var(--gold);display:grid;place-items:center}.pill svg{width:15px;height:15px}
.light .pill{background:rgba(255,255,255,.7);border-color:rgba(42,26,18,.12);color:var(--navy)}
.lower{position:absolute;left:44px;bottom:30px;width:720px;min-height:62px;padding:11px 18px 11px 12px;border-radius:18px;display:flex;gap:13px;align-items:center;z-index:5;
  background:rgba(20,10,6,.55);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(14px) saturate(1.2);box-shadow:0 20px 40px -24px rgba(0,0,0,.7)}
.light .lower{background:rgba(255,255,255,.72);border-color:rgba(42,26,18,.1)}
.lower .av{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:800;background:var(--rasp)}.lower .av.s{background:var(--navy);border:2px solid var(--gold)}
.lower small{display:block;font:800 9.5px var(--sans);letter-spacing:.18em;color:var(--gold-hi)}.light .lower small{color:var(--rasp)}
.lower p{margin:2px 0 0;font-size:15px;line-height:1.35;color:#fff}.light .lower p{color:var(--ink)}
.lower p em{font-style:normal;color:var(--gold-hi);font-weight:700}.light .lower p em{color:var(--rasp)}
.cta{position:absolute;right:44px;bottom:36px;display:flex;align-items:center;gap:10px;z-index:5;color:#fff;font-size:11px;font-weight:800;letter-spacing:.16em}
.cta b{height:40px;padding:0 16px;border-radius:20px;background:var(--gold);color:var(--navy);display:flex;align-items:center;gap:7px;font-size:16px;letter-spacing:.02em}
.light .cta{color:var(--ink)}
.cta svg{width:16px;height:16px}
/* type */
.k{font:600 11px var(--mono);letter-spacing:.14em;color:var(--gold-hi)}.light .k{color:var(--rasp)}
.h{font:400 64px/0.98 var(--serif);letter-spacing:-.015em;color:#fff}.h em{font-style:italic;color:var(--gold-hi)}
.light .h{color:var(--navy)}.light .h em{color:var(--rasp)}
.abs{position:absolute;z-index:4}
.glass{background:rgba(255,255,255,.62);border:1px solid rgba(42,26,18,.08);backdrop-filter:blur(12px);border-radius:16px;box-shadow:0 22px 40px -28px rgba(42,26,18,.6)}
.dglass{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(12px);border-radius:16px}
.steps div{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:center;padding:8px 0;border-top:1px solid rgba(42,26,18,.08);opacity:.38}
.steps div:first-child{border-top:0}.steps div.on{opacity:1}.steps div.done{opacity:.75}
.steps i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:600 11px var(--mono);font-style:normal;background:rgba(42,26,18,.08);color:var(--ink)}
.steps div.on i{background:var(--rasp);color:#fff;box-shadow:0 0 0 5px rgba(200,67,107,.18)}
.steps b{font-size:13.5px;color:var(--ink);display:block}.steps small{font-size:11.5px;color:#6a5a50}
.call{position:absolute;z-index:4;width:210px}
.call .n{font:600 11px var(--mono);color:var(--gold-hi);letter-spacing:.1em}.call b{display:block;font:400 25px/1.05 var(--serif);color:#fff;margin:3px 0 4px}.call small{font-size:11.5px;line-height:1.4;color:rgba(255,255,255,.7);display:block}
.call.r{text-align:left}.call.l{text-align:right}
</style></head><body>
<div id="f"><canvas class="full" id="bgc" width="1920" height="1080"></canvas><div class="lay" id="dom"></div>
<canvas class="full lay" id="fx" width="1920" height="1080" style="pointer-events:none;z-index:3"></canvas>

<script src="../node_modules/three/build/three.min.js"></script>
<script>
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),eo=x=>1-Math.pow(1-clamp(x),3),eio=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2},lerp=(a,b,x)=>a+(b-a)*x;
function rng(seed){let s=seed;return()=>(s=(s*16807)%2147483647)/2147483647}
const $=s=>document.querySelector(s);const S=720;const CW=1920,CH=1080;
const IMG={};const img=src=>IMG[src]||(IMG[src]=new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src}));
/*CAKE*/
const F=+(new URLSearchParams(location.search).get('f')||1);
const bgc=$('#bgc').getContext('2d');bgc.scale(1.5,1.5);const fx=$('#fx').getContext('2d');fx.scale(1.5,1.5);
const W=1280,H=720,dom=$('#dom');
const LESSONS=['RECIPE','CREAMING','RISING','OVEN','LAYERS','DECORATING','COSTING'];
const WA='<svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm4.5 12.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.6.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2s.2-1.1.2-1.2-.2-.2-.5-.3z"/></svg>';
function chrome(active,light,who,name,cap){if(light)$('#f').classList.add('light');
  dom.insertAdjacentHTML('beforeend',`<div class="lock"><img src="../../assets/brand/crest-640.webp"><div><b>ROYAL CREST ACADEMY</b><small>BIKITA · MASVINGO</small></div></div>
  <div class="rail">${LESSONS.map((l,i)=>`<div class="${i+1<active?'done':i+1===active?'on':''}">0${i+1} ${l}</div>`).join('')}</div>
  <div class="pill"><i><svg viewBox="0 0 24 24" fill="none" stroke="#13215a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16M5 20v-6h14v6M5 14c2 1.5 4-1.5 7 0s5-1.5 7 0M8 14v-3h8v3M12 11V8"/></svg></i>BAKERY</div>
  <div class="lower"><div class="av ${who==='S'?'s':''}">${who}</div><div><small>${name}</small><p>${cap}</p></div></div>
  <div class="cta">FORM 1 · 2027<b>${WA}0714 404 090</b></div>`)}
function leak(spots){$('#leak').style.background=spots.map(([x,y,r,c])=>`radial-gradient(${r}px ${r}px at ${x}px ${y}px,${c},transparent 70%)`).join(',')}
// depth-of-field dust: far = small and sharp, near = large and soft
function dust(g,n,seed,col,{minR=.6,maxR=9,area=[0,0,W,H],alpha=.8}={}){const r=rng(seed);for(let i=0;i<n;i++){const z=Math.pow(r(),2.2),x=area[0]+r()*area[2],y=area[1]+r()*area[3],rad=lerp(minR,maxR,z),blur=z>.55?(z-.55)*18:0;
  g.save();g.filter=blur?`blur(${blur}px)`:'none';g.globalAlpha=alpha*lerp(.35,.9,1-z*.5);g.fillStyle=col;g.beginPath();g.arc(x,y,rad,0,7);g.fill();g.restore()}}
// bloom: blurred additive copy of a bright source
function bloom(g,src,x,y,w,h,amt=.45,blur=28){g.save();g.globalCompositeOperation='screen';g.globalAlpha=amt;g.filter=`blur(${blur}px)`;g.drawImage(src,x,y,w,h);g.restore()}
function rays(g,ox,oy,n,len,col,seed){const r=rng(seed);g.save();g.globalCompositeOperation='screen';for(let i=0;i<n;i++){const a=2.1+r()*.9,w=.03+r()*.06,gr=g.createRadialGradient(ox,oy,0,ox,oy,len);gr.addColorStop(0,col);gr.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=gr;g.globalAlpha=.15+r()*.2;g.beginPath();g.moveTo(ox,oy);g.arc(ox,oy,len,a-w,a+w);g.closePath();g.fill()}g.restore()}
function txt(g,s,x,y,o={}){g.save();g.font=o.font||'600 14px "Plex Mono"';g.fillStyle=o.col||'#fff';g.textAlign=o.align||'center';g.textBaseline='middle';g.globalAlpha=o.a??1;if(o.ls)g.letterSpacing=o.ls;g.fillText(s,x,y);g.restore()}

/* ===== FRAME 1 · title: the hero cake, full bleed ===== */
async function f1(){chrome(0,false,'C','CHEF CHIPO · BAKERY','Add a little <em>science</em>, and a lot of <em>skill</em>, and yes. That’s a cake.');
  let g=bgc.createLinearGradient(0,0,0,H);g.addColorStop(0,'#2A160D');g.addColorStop(.62,'#1A0D07');g.addColorStop(1,'#0E0704');bgc.fillStyle=g;bgc.fillRect(0,0,W,H);
  g=bgc.createRadialGradient(830,300,20,830,330,620);g.addColorStop(0,'rgba(140,72,36,.55)');g.addColorStop(1,'rgba(0,0,0,0)');bgc.fillStyle=g;bgc.fillRect(0,0,W,H);
  rays(bgc,1180,-60,9,900,'rgba(255,196,120,.9)',4);
  // table surface with soft reflection
  g=bgc.createLinearGradient(0,520,0,H);g.addColorStop(0,'rgba(60,32,18,0)');g.addColorStop(.25,'rgba(70,38,22,.85)');g.addColorStop(1,'#120804');bgc.fillStyle=g;bgc.fillRect(0,520,W,200);
  const im=await img('../assets/crest.jpg');CAKE.setCrest(im);
  const o=CAKE.render({drop:[1,1,1,1,1,1],explode:0,rose:1,crest:1,stand:1,yaw:.5,tilt:.34,zoom:.74,shift:.2,ly:.9});
  bgc.save();bgc.globalAlpha=.18;bgc.translate(0,1065);bgc.scale(1,-.35);bgc.filter='blur(6px)';bgc.drawImage(o.cv,0,0,W,H);bgc.restore();
  bgc.drawImage(o.cv,0,0,W,H);bloom(bgc,o.cv,0,0,W,H,.35,30);
  dust(fx,120,7,'#FFE2B8',{maxR:11,alpha:.6,area:[600,0,680,720]});dust(fx,30,8,'#FFE2B8',{maxR:3,alpha:.35,area:[0,0,600,720]});
  leak([[1150,40,520,'rgba(255,150,60,.55)'],[60,700,420,'rgba(200,67,107,.35)']]);
  dom.insertAdjacentHTML('beforeend',`<div class="abs" style="left:64px;top:170px;width:560px">
   <div class="k">BAKERY &amp; FOOD PRODUCTION · A FILM IN 7 LESSONS</div>
   <div style="font:800 22px var(--sans);letter-spacing:.32em;color:#fff;margin:22px 0 4px">THE SCIENCE OF</div>
   <div style="font:italic 400 92px/.9 var(--serif);color:var(--gold-hi)">a perfect</div>
   <div style="font:400 168px/.86 var(--serif);color:#fff;letter-spacing:-.03em;text-shadow:0 20px 60px rgba(0,0,0,.5)">cake.</div>
   <div style="margin-top:22px;font-size:16px;line-height:1.5;color:rgba(255,255,255,.75);max-width:430px">From the mixing bowl to the business. Filmed in the bakery at Royal Crest Academy, Bikita.</div></div>`)}

/* ===== FRAME 2 · why it rises: a left-to-right process panorama ===== */
async function f2(){chrome(3,true,'C','CHEF CHIPO · BAKERY','Add liquid and heat, and they react, and release <em>carbon dioxide</em> gas.');
  let g=bgc.createLinearGradient(0,0,W,0);g.addColorStop(0,'#F6EFE3');g.addColorStop(.5,'#FBF3E4');g.addColorStop(1,'#F7E7CF');bgc.fillStyle=g;bgc.fillRect(0,0,W,H);
  // zone tints and dividers
  [[0,'rgba(120,100,80,.05)'],[426,'rgba(74,144,194,.07)'],[853,'rgba(242,193,78,.10)']].forEach(([x,c])=>{bgc.fillStyle=c;bgc.fillRect(x,0,427,H)});
  bgc.save();bgc.setLineDash([4,8]);bgc.strokeStyle='rgba(42,26,18,.18)';[426,853].forEach(x=>{bgc.beginPath();bgc.moveTo(x,120);bgc.lineTo(x,560);bgc.stroke()});bgc.restore();
  // ripples of liquid in the middle zone
  bgc.save();bgc.strokeStyle='rgba(74,144,194,.22)';bgc.lineWidth=1.5;for(let i=0;i<7;i++){bgc.beginPath();bgc.ellipse(640,340,40+i*42,22+i*24,0,0,7);bgc.stroke()}bgc.restore();
  const r=rng(21),P=(x,y,c,l)=>{bgc.fillStyle=c;bgc.beginPath();bgc.arc(x,y,10,0,7);bgc.fill();txt(bgc,l,x,y+1,{font:'700 10px "Plex Mono"'})};
  for(let i=0;i<26;i++){P(60+r()*330,150+r()*380,i%2?'#E04848':'#3A7BD5',i%2?'A':'B')}
  // middle: reacting pairs, CO2 streaking right with motion blur
  for(let i=0;i<16;i++){const x=470+r()*340,y=150+r()*380;
    if(i%3){bgc.save();const gr=bgc.createLinearGradient(x-80,y,x,y);gr.addColorStop(0,'rgba(43,43,43,0)');gr.addColorStop(1,'rgba(43,43,43,.35)');bgc.strokeStyle=gr;bgc.lineWidth=12;bgc.lineCap='round';bgc.beginPath();bgc.moveTo(x-80,y);bgc.lineTo(x-14,y);bgc.stroke();bgc.restore();
      bgc.fillStyle='#E04848';bgc.beginPath();bgc.arc(x-12,y,7,0,7);bgc.arc(x+12,y,7,0,7);bgc.fill();bgc.fillStyle='#2B2B2B';bgc.beginPath();bgc.arc(x,y,9,0,7);bgc.fill()}
    else{P(x-12,y,'#3A7BD5','B');P(x+12,y,'#E04848','A');bgc.save();bgc.globalCompositeOperation='screen';const s=bgc.createRadialGradient(x,y,0,x,y,40);s.addColorStop(0,'rgba(255,220,120,.9)');s.addColorStop(1,'rgba(255,220,120,0)');bgc.fillStyle=s;bgc.fillRect(x-40,y-40,80,80);bgc.restore()}}
  // right: air bubbles inflating, one huge out-of-focus bubble in the foreground
  const bub=(x,y,R,blur=0,a=1)=>{bgc.save();bgc.filter=blur?`blur(${blur}px)`:'none';bgc.globalAlpha=a;const gg=bgc.createRadialGradient(x-R*.3,y-R*.35,R*.1,x,y,R);gg.addColorStop(0,'rgba(255,255,255,.95)');gg.addColorStop(.7,'rgba(255,255,255,.35)');gg.addColorStop(1,'rgba(200,150,90,.35)');
    bgc.fillStyle=gg;bgc.beginPath();bgc.arc(x,y,R,0,7);bgc.fill();bgc.strokeStyle='rgba(160,110,60,.6)';bgc.lineWidth=2;bgc.stroke();bgc.fillStyle='rgba(255,255,255,.95)';bgc.beginPath();bgc.ellipse(x-R*.38,y-R*.4,R*.18,R*.11,-.6,0,7);bgc.fill();bgc.restore()};
  bub(960,250,58);bub(1090,380,82);bub(960,470,40);bub(1180,200,34);bub(1230,560,150,14,.85);
  for(let i=0;i<10;i++){const x=900+r()*300,y=150+r()*380;bgc.fillStyle='#E04848';bgc.beginPath();bgc.arc(x-9,y,5,0,7);bgc.arc(x+9,y,5,0,7);bgc.fill();bgc.fillStyle='#2B2B2B';bgc.beginPath();bgc.arc(x,y,6.5,0,7);bgc.fill()}
  // zone headings
  [['01 · DRY',213,'Bicarbonate (B) and acid (A) sit still'],['02 · + LIQUID + HEAT',640,'They react'],['03 · CO₂ INFLATES',1066,'The air bubbles become balloons']].forEach(([h,x,s])=>{txt(bgc,h,x,112,{col:'#C8436B',font:'600 13px "Plex Mono"'});txt(bgc,s,x,132,{col:'#6a5a50',font:'500 12px "Plus Jakarta Sans"'})});
  dust(fx,60,9,'#FFFFFF',{maxR:7,alpha:.5});leak([[1280,0,520,'rgba(255,200,120,.35)']]);
  dom.insertAdjacentHTML('beforeend',`<div class="abs" style="left:0;right:0;top:572px;text-align:center;font:400 40px var(--serif);color:var(--navy);letter-spacing:-.01em">
    NaHCO<sub style="font-size:.55em">3</sub> + acid <span style="color:var(--gold);font-family:var(--sans)">→</span> <b style="color:var(--rasp);font-weight:500">CO<sub style="font-size:.55em">2</sub>↑</b> + water</div>`)}

/* ===== FRAME 3 · the exploded cake, an editorial spread ===== */
async function f3(){chrome(5,false,'S','SAM · COMMENTARY','Hold on. It’s built in <em>layers</em>, like the house in the Technical Graphics film!');
  let g=bgc.createRadialGradient(640,330,40,640,360,760);g.addColorStop(0,'#3A2216');g.addColorStop(.6,'#1D0F09');g.addColorStop(1,'#0C0603');bgc.fillStyle=g;bgc.fillRect(0,0,W,H);
  bgc.save();bgc.strokeStyle='rgba(255,226,184,.05)';bgc.lineWidth=1;for(let x=0;x<W;x+=40){bgc.beginPath();bgc.moveTo(x,0);bgc.lineTo(x,H);bgc.stroke()}for(let y=0;y<H;y+=40){bgc.beginPath();bgc.moveTo(0,y);bgc.lineTo(W,y);bgc.stroke()}bgc.restore();
  // registration marks
  bgc.strokeStyle='rgba(226,185,59,.5)';bgc.lineWidth=1.5;[[300,110],[980,110],[300,600],[980,600]].forEach(([x,y])=>{bgc.beginPath();bgc.moveTo(x-10,y);bgc.lineTo(x+10,y);bgc.moveTo(x,y-10);bgc.lineTo(x,y+10);bgc.stroke()});
  const o=CAKE.render({drop:[1,1,1,1,1,1],explode:1,rose:0,crest:0,stand:0,yaw:.55,tilt:.22,zoom:1.02,shift:0});
  bgc.drawImage(o.cv,0,0,W,H);bloom(bgc,o.cv,0,0,W,H,.22,24);
