worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 512; }

http {
    access_log /dev/stdout;
    client_max_body_size 4M;
    keepalive_timeout 65;

    # WebSocket upgrade support (dashboard live trace feed).
    # nginx does not forward the Upgrade header by default; this map lets
    # /ws/ requests carrying "Upgrade: websocket" pass it through to uvicorn
    # while plain HTTP requests on the same location still get a normal
    # keep-alive connection.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 7860;
        server_name _;

        # ── Dashboard — real-time trace UI (prompt/response/timing)
        location /dashboard {
            proxy_pass         http://127.0.0.1:8765;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_read_timeout 10s;
        }

        # ── Dashboard live feed — WebSocket, long-lived, needs Upgrade headers
        location /ws/ {
            proxy_pass         http://127.0.0.1:8765;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host       $host;
            proxy_set_header   X-Real-IP  $remote_addr;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ── Conscious inference — full 700s budget (deadline 580 + 60 HF overhead + margin)
        location /api/jarvis/conscious {
            proxy_pass         http://127.0.0.1:8765;
            proxy_http_version 1.1;
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_set_header   Connection      "";
            proxy_read_timeout 700s;
            proxy_send_timeout 700s;
            proxy_buffering    off;
        }

        # ── Quantum Tunnel sync — covers /qt_sync and /qt_sync/status /qt_sync/*
        location /qt_sync {
            proxy_pass         http://127.0.0.1:8765;
            proxy_http_version 1.1;
            proxy_set_header   Host      $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_read_timeout 30s;
        }

        # ── Metrics endpoint — needs generous timeout (polling under load)
        location /metrics {
            proxy_pass         http://127.0.0.1:8765;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_read_timeout 10s;
        }

        # ── Health probes — /health and /health/gateway
        location /health {
            proxy_pass         http://127.0.0.1:8765;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_read_timeout 10s;
        }

        # ── Royal Crest hub: portal API, parent registration, backups (large uploads, live stream)
        location /api/v1/ {
            proxy_pass         http://127.0.0.1:8780;
            proxy_http_version 1.1;
            proxy_set_header   Host            $host;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_set_header   Connection      "";
            proxy_buffering    off;
            client_max_body_size 200M;
            proxy_read_timeout 3600s;
            proxy_send_timeout 600s;
        }

        # ── Royal Crest hub: the Control Room dashboard
        location /admin {
            proxy_pass         http://127.0.0.1:8780;
            proxy_http_version 1.1;
            proxy_set_header   Host            $host;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
        }

        # ── Catch-all — raise to 700s so any future endpoints are safe
        location / {
            proxy_pass         http://127.0.0.1:8765;
            proxy_http_version 1.1;
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 700s;
            proxy_send_timeout 700s;
        }
    }
}
